<style>
/* ============================================================
   SnipRing design system
   One font (IBM Plex Sans Hebrew), one icon family (SVG sprite),
   semantic colour tokens for light/dark, a 4px spacing scale.
   ============================================================ */
:root{
  /* colour — light */
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F0F2F7; --surface-3:#E6EAF2;
  --line:#DDE2EC; --line-strong:#C3CAD9;
  --ink:#0F172A; --ink-2:#334155; --muted:#5A6478;
  --accent:#2546F0; --accent-hover:#1B38D6; --accent-ink:#FFFFFF; --accent-soft:#E8ECFE; --accent-line:#B9C4FB;
  --danger:#C62E25; --danger-soft:#FDECEA; --ok:#12805C;
  --wave:#A6B0C5; --focus:#2546F0;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow-md:0 4px 16px -6px rgba(15,23,42,.14); --shadow-lg:0 18px 48px -18px rgba(15,23,42,.32);
  /* type */
  --font:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --logo:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --fs-xs:12px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:26px; --fs-3xl:clamp(28px,7vw,36px);
  /* space, radius, controls */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --h-sm:36px; --h-md:44px; --h-lg:52px;
  --gutter:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#131A29; --surface-2:#1A2234; --surface-3:#222C42;
  --line:#26314A; --line-strong:#36435F;
  --ink:#E8ECF5; --ink-2:#C5CCDB; --muted:#9AA5BC;
  --accent:#7D92FF; --accent-hover:#93A4FF; --accent-ink:#0B0F19; --accent-soft:#1E2747; --accent-line:#3A4A85;
  --danger:#FF8A80; --danger-soft:#3A1E22; --ok:#5BD3A2;
  --wave:#46536F; --focus:#93A4FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 18px -8px rgba(0,0,0,.6); --shadow-lg:0 20px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#131A29; --surface-2:#1A2234; --surface-3:#222C42;
  --line:#26314A; --line-strong:#36435F;
  --ink:#E8ECF5; --ink-2:#C5CCDB; --muted:#9AA5BC;
  --accent:#7D92FF; --accent-hover:#93A4FF; --accent-ink:#0B0F19; --accent-soft:#1E2747; --accent-line:#3A4A85;
  --danger:#FF8A80; --danger-soft:#3A1E22; --ok:#5BD3A2;
  --wave:#46536F; --focus:#93A4FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 18px -8px rgba(0,0,0,.6); --shadow-lg:0 20px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark}
/* legacy names still read by the waveform code */
:root{--paper:var(--surface);--well:var(--surface-2)}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:1.55;
  padding:env(safe-area-inset-top,0px) 0 0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;color:var(--ink)}
h2{font-size:var(--fs-xl)} h3{font-size:var(--fs-md)}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
bdi{unicode-bidi:isolate}
.lbl{font-size:var(--fs-sm);font-weight:500;color:var(--muted)}
.hint,.muted{color:var(--muted);font-size:var(--fs-sm);line-height:1.5}
.small{font-size:var(--fs-sm)}
.val{font-weight:600;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tagline{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;inset-inline-start:var(--s3);top:-80px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-weight:600;text-decoration:none}
.skip:focus{top:calc(var(--s3) + env(safe-area-inset-top,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;display:block}
.ic.sm{width:16px;height:16px}.ic.xs{width:11px;height:11px}.ic.xl{width:30px;height:30px}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:var(--s3) var(--gutter) var(--s8);display:flex;flex-direction:column;gap:var(--s4)}
main{display:flex;flex-direction:column;gap:var(--s4)}
main:focus{outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:var(--s4)}
@media (min-width:600px){.card{padding:var(--s6)} :root{--gutter:24px}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:56px}
.logo{font-family:var(--logo);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.5px;color:var(--ink);text-decoration:none}
.logo .ring{color:var(--accent)}
.hbtns{display:flex;align-items:center;gap:var(--s2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--h-md);padding:0 var(--s4);
  border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:var(--fs-md);font-weight:600;
  line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.lg{min-height:var(--h-lg);font-size:var(--fs-lg);border-radius:var(--r-md)}
.btn.block{display:flex;width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none}
.btn .num{font-weight:600}
.iconbtn{display:inline-grid;place-items:center;width:var(--h-md);height:var(--h-md);border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.sm{width:var(--h-md);height:var(--h-md);border-radius:var(--r-sm)}
.textbtn{min-height:var(--h-md);padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);cursor:pointer}
.textbtn:hover{background:var(--surface-2)}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--h-md);padding:0 var(--s2);background:none;border:0;color:var(--accent);font-weight:600;font-size:var(--fs-md);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.file:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.pair>.btn{min-width:0;padding-inline:var(--s3)}
@media (max-width:359px){.pair{grid-template-columns:1fr}}
.inline{display:flex;gap:var(--s2);align-items:stretch}
.inline>.input{flex:1;min-width:0}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.spin{display:none;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;animation:spin .8s linear infinite}
.btn.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(1turn)}}

/* ---------- form controls ---------- */
.field{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.input{min-height:var(--h-md);padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:16px;width:100%}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;height:var(--h-md);margin:0;background:transparent;accent-color:var(--accent);cursor:pointer}
.switch{display:flex;align-items:center;gap:var(--s3);min-height:var(--h-md);cursor:pointer;font-weight:500}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
/* segmented control: equal columns; the selected item is raised (shape cue, not colour only) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s1);padding:var(--s1);border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.seg.seg-wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--h-md);padding:0 var(--s2);border-radius:var(--r-sm);border:1px solid transparent;
  background:transparent;color:var(--ink-2);font-size:var(--fs-sm);font-weight:500;cursor:pointer;min-width:0;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip:hover:not(:disabled){color:var(--ink);background:var(--surface-3)}
.chip.sel-on,.chip[aria-pressed="true"]{background:var(--surface);color:var(--accent);border-color:var(--accent-line);font-weight:600;box-shadow:var(--shadow-sm)}
.chip span{font-size:inherit}
.seg .chip span+span{opacity:.75;font-size:var(--fs-xs);margin-inline-start:2px}
#lens .chip{gap:3px}#lens .chip span{opacity:.75;font-size:var(--fs-xs)}

/* ---------- start card ---------- */
.drop{display:flex;flex-direction:column;align-items:stretch;gap:var(--s3);text-align:center}
.droph{font-size:var(--fs-3xl);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.dropsub{color:var(--muted);font-size:var(--fs-md);max-width:38ch;margin:0 auto}
.drop .file{margin-top:var(--s2)}
.trust{list-style:none;margin:var(--s1) 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s1) var(--s4);color:var(--muted);font-size:var(--fs-sm)}
.trust li{display:inline-flex;align-items:center;gap:6px}
.droplinks{display:flex;flex-direction:column;align-items:center;gap:0}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
@media (min-width:600px){.drop .file,.drop .alt{width:100%;max-width:420px;margin-inline:auto}}
/* once a song is open the start card becomes a slim "choose another" bar */
main.editing .drop{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;padding:var(--s3)}
main.editing .drop>:not(.file):not(.alt):not(.droplinks){display:none}
main.editing .drop .file{margin:0;min-height:var(--h-md);font-size:var(--fs-md);flex:1 1 220px;max-width:none}
main.editing .drop .alt{flex:1 1 220px;max-width:none}
main.editing .drop .droplinks{flex-basis:100%}
main.editing .drop #noFile,main.editing .drop #watchBtn{display:none}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);counter-reset:st}
.steps li{counter-increment:st;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:var(--s1)}
.steps li::before{content:counter(st);width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--accent);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:600;font-size:var(--fs-sm)}
.steps b{font-size:var(--fs-sm);font-weight:600;line-height:1.35}
.steps span{display:none}
.notice{display:flex;align-items:center;gap:var(--s3);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:var(--s2) var(--s2) var(--s2) var(--s4);color:var(--ink)}
html[dir=rtl] .notice{padding:var(--s2) var(--s4) var(--s2) var(--s2)}
.notice>.ic{color:var(--accent)}
.notice p{flex:1;font-size:var(--fs-sm)}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;gap:var(--s4);padding-bottom:0}
.song{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.stitle{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.sname{font-size:clamp(20px,5.6vw,26px);font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:var(--s2);flex-wrap:wrap;min-width:0}
.badge{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-pill);padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge:empty{display:none}
.seg.modes .chip{min-height:var(--h-md);font-size:var(--fs-md)}
@media (max-width:429px){.seg.modes .chip{flex-direction:column;gap:2px;min-height:56px;font-size:var(--fs-sm);white-space:normal;line-height:1.2;padding:var(--s1)}}
.wavecard{display:flex;flex-direction:column;gap:var(--s2)}
.zoom{display:flex;align-items:center;gap:var(--s1);align-self:flex-end}
.zoom .num{min-width:3em;text-align:center;font-size:var(--fs-sm);color:var(--muted)}
.zoom .iconbtn:disabled{opacity:.4;cursor:default}
.wavebox{position:relative;direction:ltr;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wavebox:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#wave{display:block;width:100%;height:150px;cursor:grab}
.ruler{display:flex;justify-content:space-between;direction:ltr;font-size:var(--fs-xs);color:var(--muted);padding:0 2px}
.hero{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r-lg);background:var(--accent-soft);border:1px solid var(--accent-line)}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:22px;height:22px;fill:currentColor}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hero .range{display:flex;gap:var(--s2);align-items:baseline;font-size:var(--fs-xl);font-weight:600;color:var(--ink)}
html[dir=rtl] .hero .range{justify-content:flex-end}
.hero .range b{font-weight:600}
.dash{color:var(--muted)}
.hlen{flex:none;display:flex;align-items:baseline;gap:3px;background:var(--surface);color:var(--ink);border:1px solid var(--accent-line);border-radius:var(--r-md);padding:var(--s2) var(--s3)}
.hlen b{font-size:var(--fs-xl);font-weight:600}.hlen span{font-size:var(--fs-xs);color:var(--muted)}
/* sections inside the editor: dividers instead of nested boxes */
.panel{display:flex;flex-direction:column;gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line)}
.panel h3{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-lg)}
.panel h3 .ic{color:var(--accent)}
/* best-part suggestions */
.bests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s2)}
@media (max-width:599px){.bests{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(240px,82%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:var(--s1);scrollbar-width:thin}
  .bests:has(> .best:only-child){grid-auto-columns:100%}}
.best{scroll-snap-align:start;display:flex;flex-direction:column;gap:var(--s2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3)}
.best.sel-on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.best b{font-size:var(--fs-md);font-weight:600}
.best .bd{font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.best .bt{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.best .bb{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:auto}
.best .buse[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.best .bb .btn{min-height:var(--h-md);font-size:var(--fs-sm);padding:0 var(--s2)}
.tin{display:flex;align-items:center;gap:var(--s1)}
.tin .input{width:64px;text-align:center;padding:0 var(--s1);font-variant-numeric:tabular-nums}
.tin b{color:var(--muted)}
#lenR{margin-top:var(--s1)}
.fxout,#fxOut{font-size:var(--fs-sm)}
#fxOut b{color:var(--ink)}
.dedinfo{display:flex;align-items:center;gap:var(--s2);font-weight:500}
.dedinfo .ic{color:var(--ok)}
.dedhas{display:flex;flex-direction:column;gap:var(--s2)}
/* disclosure (fine-tune, advanced) */
.disclosure{border-top:1px solid var(--line)}
.disclosure summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:var(--h-lg);cursor:pointer;font-weight:600;color:var(--ink)}
.disclosure summary::-webkit-details-marker{display:none}
.disclosure .chev{color:var(--muted);transition:transform .2s}
.disclosure[open] .chev{transform:rotate(180deg)}
.dbody{display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s4)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.tlabel{font-weight:600}
.tgroup{display:flex;align-items:center;gap:var(--s1)}
.tgroup .time{min-width:6.5ch;text-align:center;font-weight:600}
.nudge{min-width:var(--h-md);min-height:var(--h-md);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:var(--fs-sm);font-variant-numeric:tabular-nums;cursor:pointer}
.nudge:hover{background:var(--surface-2)}
/* "what now?" card */
.next{display:flex;gap:var(--s4);align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:var(--s4)}
.next h3{margin-bottom:var(--s2)}

/* ---------- demo song (synthetic, so the page works before a file is chosen) ---------- */
function demoSong(){
  const sr=44100,dur=72,n=sr*dur,L=new Float32Array(n),R=new Float32Array(n);
  const beat=.5; // 120 BPM
  const add=(t,f,amp,dec,pan=0)=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*dec*5));
    for(let i=0;i<len;i++){const x=i/sr,v=amp*Math.sin(2*Math.PI*f*x)*Math.exp(-x/dec)*Math.min(1,x/.004);L[s0+i]+=v*(1-pan);R[s0+i]+=v*(1+pan)}};
  const kick=t=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*.25));let ph=0;
    for(let i=0;i<len;i++){const x=i/sr;ph+=2*Math.PI*(50+90*Math.exp(-x/.03))/sr;const v=.55*Math.sin(ph)*Math.exp(-x/.08);L[s0+i]+=v;R[s0+i]+=v}};

  const mel=[76,0,81,0,79,76,74,0, 76,0,72,74,76,0,0,0, 76,0,81,0,79,76,74,0, 79,76,74,72,69,0,0,0];
  const sections=[[0,8,'intro'],[8,28,'verse'],[28,44,'chorus'],[44,56,'verse'],[56,72,'chorus']];
  for(const [a,b,kind] of sections){
    for(let t=a;t<b;t+=beat/2){
      const step=Math.round((t-a)/(beat/2)),bar=Math.floor(t/2)%4,root=prog[bar];
      if(step%8===0)[0,4,7].forEach((iv,k)=>add(t,hz(root+12+iv),kind==='intro'?.05:.07,1.2,k-1));
      if(kind!=='intro'&&step%4===0)add(t,hz(root-12),kind==='chorus'?.32:.22,.35);
      if(kind==='verse'&&step%2===1)add(t,hz(root+24+[0,7,12][step%3]),.06,.2,.5);
      if(kind==='chorus'){const m=mel[step%32];if(m)add(t,hz(m),.24,.45,-.2);if(step%4===0)kick(t);if(step%2===1)hat(t);}
    }

  return {sampleRate:sr,length:n,duration:dur,numberOfChannels:2,getChannelData:c=>c?R:L};
}

function analyse(){

  for(let f=0;f<F;f++){let s=0;const o=f*hop;for(let i=0;i<hop;i+=2){const v=(a[o+i]+b[o+i])/2;s+=v*v}energy[f]=Math.sqrt(s/(hop/2))}

/* Chorus finder: chroma self-similarity + loudness.
   A chorus is the loud part of a song that repeats, so we look for the window
   whose harmony recurs elsewhere in the song most strongly. */
function fftMag(re, im) { // in-place radix-2, returns nothing
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

  const n = Math.floor(song.length / dec), x = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; const o = i * dec; for (let k = 0; k < dec; k++) s += a[o + k] + b[o + k]; x[i] = s / (2 * dec); }
  const N = 4096, hop = Math.round(sr * hopSec), F = Math.max(1, Math.floor((n - N) / hop) + 1);
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const pc = new Int8Array(N / 2).fill(-1);
  for (let k = 1; k < N / 2; k++) { const f = k * sr / N; if (f >= 80 && f <= 4000) pc[k] = ((Math.round(12 * Math.log2(f / 440)) + 69) % 12 + 12) % 12; }
  const chroma = new Float32Array(F * 12), rms = new Float32Array(F), re = new Float32Array(N), im = new Float32Array(N);
  for (let f = 0; f < F; f++) {
    const o = f * hop; let e = 0;
    for (let i = 0; i < N; i++) { const v = x[o + i] || 0; e += v * v; re[i] = v * win[i]; im[i] = 0; }
    rms[f] = Math.sqrt(e / N);
    fftMag(re, im);
    const c = chroma.subarray(f * 12, f * 12 + 12);
    for (let k = 1; k < N / 2; k++) if (pc[k] >= 0) c[pc[k]] += Math.hypot(re[k], im[k]);
    let mx = 0; for (let i = 0; i < 12; i++) { c[i] = Math.sqrt(c[i]); mx += c[i] / 12; }
    for (let i = 0; i < 12; i++) c[i] -= mx;              // centre: keep only which notes stand out
    let nn = 0; for (let i = 0; i < 12; i++) nn += c[i] * c[i]; nn = Math.sqrt(nn) || 1;
    for (let i = 0; i < 12; i++) c[i] /= nn;
  }
  return { chroma, rms, F, hopSec };
}

/* returns up to 3 candidate starts (seconds), best first */
function chorusCandidates(song, winSec) {
  const hopSec = 0.5, { chroma, rms, F } = songFeatures(song, hopSec);
  const W = Math.max(4, Math.min(F - 1, Math.round(winSec / hopSec)));
  if (F < W * 2 + 2) return [{ t: 0, score: 0 }];
  // similarity matrix (cosine of unit chroma vectors), contrast-stretched
  const S = new Float32Array(F * F);
  for (let i = 0; i < F; i++) for (let j = i; j < F; j++) {
    let d = 0; for (let k = 0; k < 12; k++) d += chroma[i * 12 + k] * chroma[j * 12 + k];
    d = Math.max(0, d); S[i * F + j] = S[j * F + i] = d;
  }
  // loudness, normalised 0..1
  let rmax = 0; for (let i = 0; i < F; i++) rmax = Math.max(rmax, rms[i]);
  const loud = new Float32Array(F + 1); for (let i = 0; i < F; i++) loud[i + 1] = loud[i] + rms[i] / (rmax || 1);
  const minLag = Math.round(W * 0.8), score = new Float32Array(F - W + 1);
  const sims = new Float32Array(F);
  for (let i = 0; i + W <= F; i++) {
    sims.fill(-1);
    for (let j = 0; j + W <= F; j++) {
      if (Math.abs(i - j) < minLag) continue;
      let v = 0; for (let k = 0; k < W; k++) v += S[(i + k) * F + j + k];
      sims[j] = v / W;
    }
    // the two strongest repeats at clearly different places (a chorus comes back 2-3 times)
    let j1 = -1; for (let j = 0; j < F; j++) if (sims[j] > (j1 < 0 ? -1 : sims[j1])) j1 = j;
    let j2 = -1; for (let j = 0; j < F; j++) if (Math.abs(j - j1) >= minLag && sims[j] > (j2 < 0 ? -1 : sims[j2])) j2 = j;
    const best = Math.max(0, j1 < 0 ? 0 : sims[j1]), second = Math.max(0, j2 < 0 ? 0 : sims[j2]);
    const L = (loud[i + W] - loud[i]) / W;
    score[i] = (best + second) * (0.6 + 0.4 * L);
  }
  const order = [...score.keys()].sort((p, q) => score[q] - score[p]), picked = [];
  for (const i of order) { if (picked.length >= 3) break; if (picked.every(p => Math.abs(p - i) >= W * 0.75)) picked.push(i); }
  return picked.map(i => {
    // snap to the strongest loudness rise within ±3 s (section boundary)
    let bi = i, bd = -1;
    for (let k = Math.max(2, i - 6); k <= Math.min(F - W, i + 6); k++) { const d = (rms[k] + (rms[k + 1] || 0)) - (rms[k - 1] + rms[k - 2]); if (d > bd) { bd = d; bi = k; } }
    return { t: bi * hopSec, score: score[i] };
  });
}

function energyCandidates(){
  const F=energy.length,W=Math.min(F,Math.round(Math.min(M().def,song.duration)*FR));
  const pre=new Float64Array(F+1);for(let i=0;i<F;i++)pre[i+1]=pre[i]+energy[i];
  const mean=(s,w)=>(pre[Math.min(F,s+w)]-pre[Math.max(0,s)])/Math.max(1,Math.min(F,s+w)-Math.max(0,s));
  const scores=[];for(let s=0;s+W<=F;s+=5)scores.push([mean(s,W),s]);
  scores.sort((x,y)=>y[0]-x[0]);
  const picked=[];
  for(const [sc,s] of scores){if(picked.length>=3)break;if(picked.every(p=>Math.abs(p.s-s)>=W*.6))picked.push({sc,s})}
  cands=picked.map(p=>{let best=p.s,bd=-1;
    for(let s=Math.max(0,p.s-50);s<=Math.min(F-W,p.s+50);s++){const d=mean(s,10)-mean(s-10,10);if(d>bd){bd=d;best=s}}
    return {t:best/FR,score:p.sc}});
  return cands;
}
/* "Find the best part": three different, real measurements of the song (no AI, nothing simulated)
   chorus = the window whose harmony repeats most (chroma self-similarity)
   drop   = the biggest sudden rise in loudness
   peak   = the loudest stretch of the song */
function findCandidates(){
  const D=song.duration,L=Math.min(M().def,CAP()),out=[],far=t=>out.every(c=>Math.abs(c.t-t)>=Math.min(8,L*.5));
  if(D<Math.max(6,L*.6)){cands=[{t:0,kind:'start'}];renderCands();pickCand(0);return}
  let ch=[];try{ch=chorusCandidates(song,15)}catch(e){}
  if(ch.length&&ch[0].score)out.push({t:ch[0].t,kind:'chorus'});
  const F=energy.length,pre=new Float64Array(F+1);for(let i=0;i<F;i++)pre[i+1]=pre[i]+energy[i];
  const mean=(s0,w)=>{const a=Math.max(0,s0),b=Math.min(F,s0+w);return b>a?(pre[b]-pre[a])/(b-a):0};
  // drop: after/before loudness ratio over 4 s, at least 6 s into the song
  const H=4*FR,drops=[];for(let f=Math.max(H,6*FR);f+H<F;f+=2){const bef=mean(f-H,H),aft=mean(f,H);if(aft>.05)drops.push([aft/(bef+.02),f])}
  drops.sort((x,y)=>y[0]-x[0]);for(const [r,f] of drops){if(r<1.35)break;const t=f/FR;if(far(t)){out.push({t,kind:'drop'});break}}
  // peak: loudest window of the ringtone length
  const W=Math.min(F,Math.round(L*FR)),pk=[];for(let s0=0;s0+W<=F;s0+=5)pk.push([mean(s0,W),s0]);
  pk.sort((x,y)=>y[0]-x[0]);for(const [,s0] of pk){const t=s0/FR;if(far(t)){out.push({t,kind:'peak'});break}}
  if(!out.length)out.push({t:0,kind:'start'});
  cands=out;renderCands();pickCand(0);
}

function draw(playT){
  if(!peaks)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const D=song.duration,VD=D/Z,X=t=>(t-V0)/VD*w,x0=X(S.start),x1=X(S.start+S.len),acc=css('--accent'),wave=css('--wave'),ink=css('--ink');
  const rr=(x,y,ww,hh,r)=>{g.beginPath();g.roundRect?g.roundRect(x,y,ww,hh,r):g.rect(x,y,ww,hh)};
  // selected window: soft fill and a glowing outline
  g.fillStyle=css('--accent-soft');rr(x0,6,x1-x0,h-12,12);g.fill();
  g.save();g.strokeStyle=acc;g.lineWidth=2;rr(x0+1,7,x1-x0-2,h-14,12);g.stroke();g.restore();
  // rounded bars; inside the window they light up, and fill in as the ringtone plays
  const ph=playT!=null?X(playT):-1,step=5,bw=3,mid=h/2;
  for(let x=2;x<w-1;x+=step){const tt=V0+x/w*VD,i0=Math.floor(tt/D*peaks.length),i1=Math.max(i0+1,Math.floor((tt+step/w*VD)/D*peaks.length));
    let p=0;for(let i=i0;i<i1&&i<peaks.length;i++)if(peaks[i]>p)p=peaks[i];const bh=Math.max(3,p*(h-34));
    const inside=x>=x0&&x<=x1;
    g.globalAlpha=inside?(ph>=0&&x>ph?.55:1):.55;g.fillStyle=inside?acc:wave;rr(x,mid-bh/2,bw,bh,1.5);g.fill()}
  g.globalAlpha=1;
  // handles: pills on the window edges
  for(const x of [x0,x1]){g.fillStyle=acc;rr(x-6,mid-22,12,44,6);g.fill();
    g.fillStyle=css('--accent-ink');g.fillRect(x-2,mid-9,1.5,18);g.fillRect(x+0.5,mid-9,1.5,18)}
  const ct=playT!=null?playT:S.cursor;
  if(ct!=null){const px=X(ct);g.fillStyle=ink;g.fillRect(px-1,4,2,h-8);g.beginPath();g.arc(px,6,4.5,0,7);g.fill()}
}

function selGain(){
  if(!S.norm)return 1;const sr=song.sampleRate,a=Math.floor(S.start*sr),b=Math.min(song.length,a+Math.floor(S.len*sr));let pk=0;
  for(let c=0;c<Math.min(2,song.numberOfChannels);c++){const d=song.getChannelData(c);for(let i=a;i<b;i+=3){const v=Math.abs(d[i]);if(v>pk)pk=v}}
  return pk>0?Math.min(4,.89/pk):1;
}

/* ---------- playback: the selection (with fades) or the song from the cursor ---------- */
let playing=false,src=null,raf=0,t0=0,from=0,buf=null,mode='sel';
const pos=()=>from+Math.max(0,ctx.currentTime-t0);
function toAudioBuffer(){
  if(song instanceof AudioBuffer)return song;
  if(buf&&buf._for===song)return buf;
  const c=ensureCtx();buf=c.createBuffer(2,song.length,song.sampleRate);buf.copyToChannel(song.getChannelData(0),0);buf.copyToChannel(song.getChannelData(1),1);buf._for=song;return buf;
}
function startPlayback(at,len,fades){
  if(playing)stopPreview();
  const c=ensureCtx(),g=c.createGain(),k=fades?selGain():1;
  src=c.createBufferSource();src.buffer=toAudioBuffer();src.connect(g);g.connect(c.destination);
  t0=c.currentTime+.05;from=at;
  if(fades){g.gain.setValueAtTime(S.fin>0?0:k,t0);if(S.fin>0)g.gain.linearRampToValueAtTime(k,t0+S.fin);
    g.gain.setValueAtTime(k,t0+Math.max(S.fin,len-S.fout));g.gain.linearRampToValueAtTime(S.fout>0?0:k,t0+len)}
  src.start(t0,at,len);playing=true;setIcon();
  const me=src;src.onended=()=>{if(playing&&src===me){playing=false;if(mode==='full'){S.cursor=Math.min(song.duration,from+len)}setIcon();cancelAnimationFrame(raf);draw()}};
  const loop=()=>{if(!playing)return;const p=pos();if(mode==='full'){$('cursorT').textContent=fmtShort(p)}draw(p);raf=requestAnimationFrame(loop)};loop();
}
function previewSel(tail){
  if(playing)stopPreview();mode='sel';
  const c=ensureCtx(),clip=processClip(),b=c.createBuffer(2,clip.n,clip.sr);b.copyToChannel(clip.chans[0],0);b.copyToChannel(clip.chans[1],1);
  const dur=clip.n/clip.sr,off=tail&&dur>4?dur-4:0,seg=clip.seg/clip.sr;
  src=c.createBufferSource();src.buffer=b;src.connect(c.destination);t0=c.currentTime+.05;from=0;src.start(t0,off);playing=true;setIcon();
  const me=src;src.onended=()=>{if(playing&&src===me){playing=false;setIcon();cancelAnimationFrame(raf);draw()}};
  const loop=()=>{if(!playing||mode!=='sel')return;const e=off+Math.max(0,c.currentTime-t0);draw(S.start+(e%seg)*S.speed);raf=requestAnimationFrame(loop)};loop()}
function playFull(at){mode='full';startPlayback(at,song.duration-at,false)}
function preview(){previewSel()}
function stopPreview(){if(playing&&mode==='full')S.cursor=Math.round(pos()*10)/10;playing=false;try{src&&src.stop()}catch(e){}cancelAnimationFrame(raf);setIcon();$('cursorT').textContent=fmtShort(S.cursor||0);draw()}
function setIcon(){const on=playing&&mode==='sel';$('playIcon').innerHTML=on?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 4.5v15l13-7.5z"/>';$('play').setAttribute('aria-label',on?t('stop'):t('playRt'));
  $('playFromT').textContent=(playing&&mode==='full')?t('stop'):t('playSong')}
$('play').addEventListener('click',()=>{if(playing&&mode==='sel')return stopPreview();previewSel();track('preview_clicked',{where:'ringtone'})});
$('playFrom').addEventListener('click',()=>{if(playing&&mode==='full')return stopPreview();playFull(S.cursor||0);track('preview_clicked',{where:'song'})});

/* ---------- load a file ---------- */
async function loadFile(f){
  if(!f)return;stopPreview();
  const isVideo=/^video\//.test(f.type)||/\.(mp4|mov|m4v)$/i.test(f.name);
  if(f.size>400*1024*1024){say(t('sTooBig'));track('song_open_failed',{ext:'too_big'});return}
  track('upload_started',{source_type:isVideo?'video':'file'});say(t('sOpening')+f.name+'…');
  try{
    const ab=await f.arrayBuffer();const c=ensureCtx();
    song=await new Promise((res,rej)=>{const p=c.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
    let fname=f.name;try{fname=decodeURIComponent(fname)}catch(e){}
    const nm=fname.replace(/\.[^.]+$/,'');await useSong(song,nm,isVideo?'video':'file',fname);
  }catch(e){say(isVideo?t('sVideoFail'):t('sOpenFail'));track('song_open_failed',{ext:(f.name.split('.').pop()||'').toLowerCase()})}
}
$('file').addEventListener('change',e=>loadFile(e.target.files[0]));
/* any decoded/generated audio → editor (recordings and original ringtones use this too) */

function resetFx(){S.voice='none';S.gain=0;S.speed=1;S.loop=1;S.vo=null;refreshOut();refreshDed()}
/* name/badge may be functions: auto-generated names (recordings, tunes) are re-translated when the language changes */
let songAuto=null;
async function useSong(buf,name,source,badge){
  songAuto=(typeof name==='function'||typeof badge==='function')?{nf:typeof name==='function'?name:null,bf:typeof badge==='function'?badge:null}:null;
  if(typeof name==='function')name=name();if(typeof badge==='function')badge=badge();
  stopPreview();song=buf;resetFx();invalidate();
  $('songTitle').textContent=name;$('name').value=name.slice(0,40);delete $('name').dataset.touched;$('badge').textContent=badge||'';
  $('songLen').textContent=fmtShort(song.duration);S.cursor=0;$('cursorT').textContent='0:00';
  say(t('sFinding'));await new Promise(r=>setTimeout(r,30));
  analyse();ruler();openEditor();
  if(source==='mine'){
    // a saved ringtone is already cut and faded: select all of it and don't fade it again
    S.fin=0;S.fout=0;$('fin').value=0;$('fout').value=0;$('finV').textContent='0.0 '+t('sec');$('foutV').textContent='0.0 '+t('sec');
    S.cand=-1;setRange(0,Math.min(song.duration,CAP()),'start');markCand();say(t('sMineLoaded'));
  }else{S.fin=M().fin;S.fout=M().fout;$('fin').value=S.fin;$('fout').value=S.fout;$('finV').textContent=S.fin.toFixed(1)+' '+t('sec');$('foutV').textContent=S.fout.toFixed(1)+' '+t('sec');say(t(cands.length===1&&cands[0].kind==='start'?'sLoadedShort':'sLoaded'))}
  // always bring the editor into view, also when it was already open (e.g. "edit again" from the bottom of the page)
  {const calm=matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.classList.contains('a-still');
   requestAnimationFrame(()=>$('editor').scrollIntoView({behavior:calm?'auto':'smooth',block:'start'}))}
  previewSel();

}
const closeDlg=d=>{d.close?d.close():d.removeAttribute('open')},openDlg=d=>{d.showModal?d.showModal():d.setAttribute('open','')};

/* ---------- record from the microphone (stays on the device) ---------- */
let rec=null,recTarget='song';
function recUI(on){$('recGo').setAttribute('aria-pressed',String(on));$('recGo').setAttribute('aria-label',on?t('recStop'):t('recStart'))}
function openRec(from,target){recTarget=target||'song';const ded=recTarget==='ded';$('recTitle').textContent=t(ded?'dedH':'recH');$('recPtxt').textContent=t(ded?'dedRecP':'recP');
  stopPreview();$('recT').textContent='0:00';$('recSt').textContent=t('recReady');recUI(false);drawMeter(null);openDlg($('rec'));track('rec_opened',{from})}
function drawMeter(lv){const c=$('recMeter'),dpr=window.devicePixelRatio||1,w=c.clientWidth||300,h=c.clientHeight||70;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.fillStyle=css('--accent');
  const hist=(rec&&rec.hist)||[];for(let i=0;i<Math.floor(w/5);i++){const v=hist[hist.length-Math.floor(w/5)+i]||0,bh=Math.max(3,v*h*.95);
    g.beginPath();g.roundRect?g.roundRect(i*5,(h-bh)/2,3,bh,1.5):g.rect(i*5,(h-bh)/2,3,bh);g.fill()}}
/* Capture raw PCM straight from the mic. No MediaRecorder and no decoding step:
   Safari's recorder output (fragmented MP4) often fails to decode, which broke recording on iPhone. */
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('recSt').textContent=t('recNo');track('rec_failed',{why:'unsupported'});return}
  const c=ensureCtx();
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}
  catch(e){$('recSt').textContent=t('recDenied');track('rec_failed',{why:(e&&e.name)||'error'});return}
  try{await c.resume()}catch(e){}
  const srcN=c.createMediaStreamSource(stream),proc=c.createScriptProcessor(4096,1,1),mute=c.createGain();mute.gain.value=0;
  const chunks=[];let level=0;
  proc.onaudioprocess=e=>{if(!rec)return;const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));let pk=0;for(let i=0;i<d.length;i+=8){const v=Math.abs(d[i]);if(v>pk)pk=v}level=pk};
  srcN.connect(proc);proc.connect(mute);mute.connect(c.destination);
  rec={stream,srcN,proc,mute,chunks,sr:c.sampleRate,t0:performance.now(),hist:[],lv:()=>level};
  recUI(true);$('recSt').textContent=t('recOn');track('rec_started');
  const tick=()=>{if(!rec)return;const el=(performance.now()-rec.t0)/1000;$('recT').textContent=fmtShort(el);
    rec.hist.push(Math.min(1,rec.lv()*1.6));drawMeter();if(el>=(recTarget==='ded'?12:60)){stopRec();return}requestAnimationFrame(tick)};tick();
}
function endRec(r){try{r.srcN.disconnect();r.proc.disconnect();r.mute.disconnect()}catch(e){}r.proc.onaudioprocess=null;r.stream.getTracks().forEach(tr=>tr.stop())}
function stopRec(){const r=rec;if(!r)return;rec=null;recUI(false);endRec(r);
  try{const total=r.chunks.reduce((s,a)=>s+a.length,0);
    if(total<r.sr*.3)throw new Error('short');
    // trim the first 50 ms (mic click) and build a stereo buffer
    const skip=Math.min(Math.floor(r.sr*.05),total-1),n=total-skip,mono=new Float32Array(n);let o=-skip;
    for(const ch of r.chunks){for(let i=0;i<ch.length;i++,o++)if(o>=0)mono[o]=ch[i]}
    if(recTarget==='ded'){let pk=0;for(const v of mono)pk=Math.max(pk,Math.abs(v));const g=pk>0?Math.min(8,.9/pk):1;for(let i=0;i<n;i++)mono[i]*=g;
      S.vo={data:mono,sr:r.sr};closeDlg($('rec'));refreshDed();refreshOut();invalidate();track('ded_added',{seconds:Math.round(n/r.sr)});previewSel();return}
    const buf={sampleRate:r.sr,length:n,duration:n/r.sr,numberOfChannels:2,getChannelData:()=>mono};
    closeDlg($('rec'));const d=new Date(),hm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),nm=()=>t('recName')+' '+hm;
    track('rec_done',{seconds:Math.round(buf.duration)});useSong(buf,nm,'record',()=>t('recBadge'));
  }catch(e){$('recSt').textContent=e&&e.message==='short'?t('recShort'):t('recFail');track('rec_failed',{why:(e&&e.message)||'build'})}}
$('recGo').addEventListener('click',()=>rec?stopRec():startRec());
$('rec').addEventListener('close',()=>{if(rec){const r=rec;rec=null;endRec(r);recUI(false)}});
$('recBtn').addEventListener('click',()=>openRec('hero'));

/* ---------- original ringtones: SnipRing composes a new melody (no copyright involved) ---------- */
const G={style:'marimba',seed:1+Math.floor(Math.random()*9999),bpm:120,song:null,src:null,name:''};

  const note=(t,m,len,vel,pan=0)=>{const f=hz(m),s0=Math.floor(t*sr);
    if(style==='marimba'){const N=Math.floor(sr*1.2);for(let i=0;i<N;i++){const x=i/sr;put(s0+i,vel*(Math.sin(6.2832*f*x)+.35*Math.sin(6.2832*4*f*x)*Math.exp(-x/.05)+.08*Math.sin(6.2832*9.9*f*x)*Math.exp(-x/.015))*Math.exp(-x/.32)*Math.min(1,x/.0015),pan)}}

  const bassN=(t,m,len,vel)=>{const f=hz(m),s0=Math.floor(t*sr),N=Math.floor(sr*len);let ph=0;for(let i=0;i<N;i++){const x=i/sr;ph=(ph+f/sr)%1;
    const v=style==='retro'?(ph<.5?4*ph-1:3-4*ph):SOFT[(ph*TN)|0];put(s0+i,vel*v*Math.min(1,x/.005)*Math.min(1,(N-i)/300)*(style==='pop'?Math.exp(-x/.4):1),0)}};

function genName(g=G){if(g.name)return t('genOf').replace('{n}',g.name);return t('st'+g.style[0].toUpperCase()+g.style.slice(1))+' #'+String(g.seed%10000).padStart(4,'0')}
function genStop(){if(G.src){try{G.src.stop()}catch(e){}G.src=null}genLbl(false)}

/* ---------- render + encode ---------- */
/* selection → speed → repeat → volume → fades, capped under 30 s. Used for both preview and export. */
const VSPEED={chip:1.45};
function effSpeed(){return S.speed*(VSPEED[S.voice]||1)}
/* selection → speed → reverse/repeat → volume → fades → voice effect → dedication → soft clip.
   One pipeline for both preview and export, capped under 30 s. */
function processClip(){
  const sr=song.sampleRate,a=Math.floor(S.start*sr),n0=Math.max(1,Math.min(song.length-a,Math.floor(S.len*sr)));
  const sp=effSpeed(),seg=Math.max(1,Math.floor(n0/sp)),n=Math.min(Math.floor(CAP()*sr),seg*S.loop),rev=S.voice==='rev';
  const k=selGain()*Math.pow(10,S.gain/20),fi=Math.floor(Math.min(S.fin,n/sr/2)*sr),fo=Math.floor(Math.min(S.fout,n/sr/2)*sr),xf=Math.floor(.012*sr),chans=[];
  for(let c=0;c<2;c++){const src=song.getChannelData(Math.min(c,song.numberOfChannels-1)),out=new Float32Array(n);
    for(let i=0;i<n;i++){const j=i%seg,jj=rev?seg-1-j:j,p=a+jj*sp,i0=Math.floor(p),f=p-i0,s1=src[Math.min(i0+1,song.length-1)];
      let v=(src[i0]||0)*(1-f)+(s1||0)*f,env=k;
      if(S.loop>1){if(j<xf&&i>=seg)env*=j/xf;if(seg-j<xf&&i+xf<n)env*=(seg-j)/xf}
      if(i<fi)env*=i/fi;if(i>n-fo)env*=(n-i)/fo;
      out[i]=v*env}
    voiceFx(out,sr);chans.push(out)}
  mixDedication(chans,sr,n);
  const soft=v=>{const x=Math.abs(v);return x<=.8?v:Math.sign(v)*(.8+.2*Math.tanh((x-.8)/.2))};
  for(const ch of chans)for(let i=0;i<n;i++)ch[i]=soft(ch[i]);
  return {sr,n,chans,seg};
}
function voiceFx(x,sr){const v=S.voice,n=x.length;
  if(v==='robot'){for(let i=0;i<n;i++)x[i]*=1.5*Math.sin(2*Math.PI*62*i/sr)}
  else if(v==='echo'){const d=Math.floor(.23*sr);for(let i=d;i<n;i++)x[i]+=.48*x[i-d];for(let i=0;i<n;i++)x[i]*=.72}
  else if(v==='bit'){const hold=6;let h=0;for(let i=0;i<n;i++){if(i%hold===0)h=Math.round(x[i]*12)/12;x[i]=h}}
  else if(v==='bass'){const al=1-Math.exp(-2*Math.PI*150/sr);let lp=0;for(let i=0;i<n;i++){lp+=al*(x[i]-lp);x[i]=.7*(x[i]+1.8*lp)}}
  else if(v==='phone'){const ah=1-Math.exp(-2*Math.PI*450/sr),al=1-Math.exp(-2*Math.PI*2800/sr);let l1=0,l2=0;
    for(let i=0;i<n;i++){l1+=ah*(x[i]-l1);const hp=x[i]-l1;l2+=al*(hp-l2);x[i]=Math.tanh(l2*2.4)*.8}}
}
/* voice dedication: a short recording laid over the start, with the music ducked underneath */
function mixDedication(chans,sr,n){const vo=S.vo;if(!vo)return;
  const off=Math.floor(.25*sr),ratio=vo.sr/sr,vn=Math.min(n-off,Math.floor(vo.data.length/ratio)),ramp=Math.floor(.18*sr),low=.2;
  if(vn<=0)return;
  for(let i=0;i<n;i++){let d=1;
    if(i>=off-ramp&&i<off)d=1-(1-low)*(i-(off-ramp))/ramp;else if(i>=off&&i<off+vn)d=low;else if(i>=off+vn&&i<off+vn+ramp)d=low+(1-low)*(i-off-vn)/ramp;
    let v=0;if(i>=off&&i<off+vn){const q=(i-off)*ratio,q0=Math.floor(q),f=q-q0;v=(vo.data[q0]||0)*(1-f)+(vo.data[q0+1]||0)*f}
    chans[0][i]=chans[0][i]*d+v;chans[1][i]=chans[1][i]*d+v}
}
function renderClip(){return processClip()}
/* ---------- mp3 (what iOS 26 "Use as Ringtone" accepts) ---------- */
function toMp3(clip){
  if(!window.lamejs||!lamejs.Mp3Encoder)return null;
  try{
    const enc=new lamejs.Mp3Encoder(2,clip.sr,192),B=1152,out=[];
    const i16=a=>{const r=new Int16Array(a.length);for(let i=0;i<a.length;i++)r[i]=Math.max(-1,Math.min(1,a[i]))*32767;return r};
    const L=i16(clip.chans[0]),R=i16(clip.chans[1]);
    for(let o=0;o<clip.n;o+=B){const b=enc.encodeBuffer(L.subarray(o,o+B),R.subarray(o,o+B));if(b.length)out.push(new Uint8Array(b))}
    const f=enc.flush();if(f.length)out.push(new Uint8Array(f));
    const len=out.reduce((s,a)=>s+a.length,0),res=new Uint8Array(len);let p=0;for(const a of out){res.set(a,p);p+=a.length}
    return res;
  }catch(e){return null}
}

/* ID3v2.3 title tag (UTF-16) so the ringtone keeps the chosen name */
function id3(title){
  const u=[];for(const ch of title){const c=ch.codePointAt(0);if(c>0xffff){const v=c-0x10000;u.push(0xd800+(v>>10),0xdc00+(v&0x3ff))}else u.push(c)}
  const body=new Uint8Array(1+2+u.length*2+2);body[0]=1;body[1]=0xff;body[2]=0xfe;
  u.forEach((c,i)=>{body[3+i*2]=c&255;body[4+i*2]=c>>8});
  const frame=new Uint8Array(10+body.length);frame.set([84,73,84,50],0);
  const n=body.length;frame.set([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255],4);frame.set(body,10);
  const size=frame.length,tag=new Uint8Array(10+size);tag.set([73,68,51,3,0,0],0);
  tag.set([(size>>21)&127,(size>>14)&127,(size>>7)&127,size&127],6);tag.set(frame,10);return tag;
}

  const paint=()=>{opts.forEach(o=>root.classList.toggle('a-'+o,!!on[o]));
    document.querySelectorAll('.a11y-opt[data-a]').forEach(b=>b.setAttribute('aria-pressed',String(!!on[b.dataset.a])));
    try{localStorage.setItem(KEY,JSON.stringify(on))}catch(e){}draw()};
  const open=v=>{$('a11yPanel').hidden=!v;$('a11yBtn').setAttribute('aria-expanded',String(v));if(v)$('a11yClose').focus();else $('a11yBtn').focus()};
  $('a11yBtn').addEventListener('click',()=>open($('a11yPanel').hidden));
  $('a11yClose').addEventListener('click',()=>open(false));
  $('a11yPanel').addEventListener('keydown',e=>{if(e.key==='Escape')open(false)});
  document.querySelectorAll('.a11y-opt[data-a]').forEach(b=>b.addEventListener('click',()=>{on[b.dataset.a]=!on[b.dataset.a];paint();track('a11y_toggle',{option:b.dataset.a,on:!!on[b.dataset.a]})}));
  $('a11yReset').addEventListener('click',()=>{on={};paint()});
  paint();
})();

/* theme: system → light → dark; stored per device, applied before paint by the head script */
const THEMES=['system','light','dark'];let theme='system';try{theme=localStorage.getItem('snipring-theme')||'system'}catch(e){}if(!THEMES.includes(theme))theme='system';
function paintTheme(){const r=document.documentElement;if(theme==='system')delete r.dataset.theme;else r.dataset.theme=theme;
  $('themeIc').setAttribute('href','#i-'+(theme==='system'?'system':theme==='light'?'sun':'moon'));
  $('themeBtn').setAttribute('aria-label',t('theme')+': '+t('th_'+theme));$('themeBtn').title=t('theme')+': '+t('th_'+theme);
  $('themeColor').setAttribute('content',getComputedStyle(r).getPropertyValue('--bg').trim()||'#F4F6FA');
  if(typeof song!=='undefined'&&song)requestAnimationFrame(()=>draw())}
$('themeBtn').addEventListener('click',()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{if(theme==='system')localStorage.removeItem('snipring-theme');else localStorage.setItem('snipring-theme',theme)}catch(e){}paintTheme();track('theme_switched',{to:theme})});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='system')paintTheme()});
/* on-screen keyboard: let the sticky create bar fall back into the flow so it never covers the field being typed in */
{const isText=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&/^(text|search|number|email|url|tel|)$/.test(el.type)));
 document.addEventListener('focusin',e=>{if(isText(e.target)&&matchMedia('(pointer:coarse)').matches)document.documentElement.classList.add('kbd')});
 document.addEventListener('focusout',e=>{if(isText(e.target))setTimeout(()=>{if(!isText(document.activeElement))document.documentElement.classList.remove('kbd')},50)})}
$('lang').addEventListener('click',()=>{lang=lang==='he'?'en':'he';try{localStorage.setItem('snipring-lang',lang)}catch(e){}applyLang();track('language_switched',{to:lang});say(t('sReady0'))});

nf.addEventListener('click',e=>{if(e.target===nf)$('nfClose').click()});

  try{history.replaceState(null,'',location.pathname)}catch(e){}}

/* incoming call preview: plays the finished ringtone on a full-screen call screen */
let callSrc=null,callPrev=null;
function callInit(){const v=$('callName').value.trim();$('callInit').textContent=v?[...v][0].toUpperCase():'';
  let h=0;for(const ch of v)h=(h*31+ch.codePointAt(0))%360;const o=$('callOv').style;o.setProperty('--cA','hsl('+h+' 55% 45%)');o.setProperty('--cB','hsl('+((h+60)%360)+' 45% 35%)')}
/* drag to answer: the iPhone-style knob slides sideways, the Android-style button swipes up; a tap also works */
function dragAnswer(el,axis,limit){let d=null;
  el.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY,moved:0};el.setPointerCapture(e.pointerId);el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!d)return;const v=axis==='x'?Math.max(0,e.clientX-d.x):Math.max(0,d.y-e.clientY);d.moved=v;
    el.style.transform=axis==='x'?'translateX('+Math.min(v,limit())+'px)':'translateY('+(-Math.min(v,limit()))+'px)'});
  const end=()=>{if(!d)return;const done=d.moved>=limit()*.8||d.moved<6;d=null;el.style.transition='transform .25s';el.style.transform='';if(done)closeCall('accept')};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{d=null;el.style.transform=''});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeCall('accept')}})}
dragAnswer($('cKnob'),'x',()=>$('cSlide').clientWidth-72);
dragAnswer($('cPill'),'y',()=>120);
dragAnswer($('callYes'),'y',()=>110);
$('cDecl').addEventListener('click',()=>closeCall('decline'));
function openCall(){if(!song)return;stopPreview();callPrev=document.activeElement;
  let nm='';try{nm=localStorage.getItem('snipring-callname')||''}catch(e){}$('callName').value=nm||t('callDefault');callInit();
  $('callTune').textContent=$('name').value.trim()||t('sample');
  const ov=$('callOv');ov.classList.toggle('ios',!ANDROID);ov.classList.toggle('and',ANDROID);
  $('callOv').hidden=false;document.body.style.overflow='hidden';document.querySelector('.wrap').setAttribute('aria-hidden','true');
  try{const c=ensureCtx(),clip=processClip(),b=c.createBuffer(2,clip.n,clip.sr);b.copyToChannel(clip.chans[0],0);b.copyToChannel(clip.chans[1],1);
    callSrc=c.createBufferSource();callSrc.buffer=b;callSrc.loop=true;callSrc.connect(c.destination);callSrc.start()}catch(e){}
  (ANDROID?$('callYes'):$('cKnob')).focus();track('call_preview',{mode:S.mode,style:ANDROID?'android':'iphone'})}
function closeCall(how){if($('callOv').hidden)return;try{callSrc&&callSrc.stop()}catch(e){}callSrc=null;$('callOv').hidden=true;document.body.style.overflow='';document.querySelector('.wrap').removeAttribute('aria-hidden');
  try{localStorage.setItem('snipring-callname',$('callName').value.trim())}catch(e){}callPrev&&callPrev.focus&&callPrev.focus();track('call_closed',{how})}
$('callBtn').addEventListener('click',openCall);
$('callYes').addEventListener('click',()=>closeCall('accept'));
$('callNo').addEventListener('click',()=>closeCall('decline'));
$('callName').addEventListener('input',callInit);
$('callOv').addEventListener('keydown',e=>{if(e.key==='Escape'){closeCall('esc');return}
  if(e.key==='Tab'){const f=ANDROID?[$('callName'),$('callNo'),$('callYes')]:[$('callName'),$('cKnob'),$('cDecl')],i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?f.length-1:1))%f.length].focus()}});
/* help: the full how-to in a popup, reachable from anywhere */
$('helpBtn').addEventListener('click',()=>{const d=$('help');
  if(d.showModal){d.showModal()}else{d.setAttribute('open','')}track('installation_guide_opened',{where:'help',editor:$('editor').hidden?'no':'yes'})});
$('helpClose').addEventListener('click',()=>{const d=$('help');d.close?d.close():d.removeAttribute('open');$('helpBtn').focus()});
$('help').addEventListener('click',e=>{if(e.target===$('help'))$('helpClose').click()});
/* ---------- my ringtones: kept in IndexedDB on this device only ---------- */
let mine=[],mineAudio=null,mineUrl=null,minePlaying=null;
function db(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('snipring',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('rings',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbDo(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('rings',mode),st=tx.objectStore('rings'),out=fn(st);
  tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)})}
/* records: {id(created ms), name, secs, data(ArrayBuffer mp3), type:'ring'|'text'|'alarm', fav:bool}
   older records without type/fav are read as a ringtone, not favourite */
const sortMine=()=>mine.sort((a,b)=>(!!b.fav-!!a.fav)||(b.id-a.id));
async function loadMine(){try{const all=await dbDo('readonly',st=>st.getAll());mine=all||[];sortMine()}catch(e){mine=[]}renderMine()}
const putRec=r=>dbDo('readwrite',st=>st.put(r));
async function prune(){const extra=mine.filter(r=>!r.fav).sort((a,b)=>a.id-b.id);while(mine.length>30&&extra.length){const old=extra.shift();mine=mine.filter(x=>x!==old);try{await dbDo('readwrite',st=>st.delete(old.id))}catch(e){}}}
async function saveMine(file,secs,title){
  try{// stored as a plain ArrayBuffer: Safari has been unreliable with Blobs inside IndexedDB
    const data=await file.arrayBuffer();
    const rec={id:Date.now(),name:title||file.name.replace(/\.mp3$/i,''),secs:Math.round(secs*10)/10,data,type:S.mode,fav:false};
    const last=[...mine].sort((a,b)=>b.id-a.id)[0];
    if(last&&last.name===rec.name&&last.data.byteLength===data.byteLength){say($('status').textContent+' '+t('mineSaved'));return}
    await putRec(rec);mine.push(rec);await prune();sortMine();
    renderMine();say($('status').textContent+' '+t('mineSaved'));
  }catch(e){track('mine_save_failed',{err:String(e&&e.name||e)})}
}
const mineBlob=r=>r.blob||new Blob([r.data],{type:'audio/mpeg'});
function mineFile(r){return new File([mineBlob(r)],r.name.replace(/:/g,'.')+'.mp3',{type:'audio/mpeg'})}
function stopMine(){if(mineAudio){mineAudio.pause();mineAudio=null}if(mineUrl){URL.revokeObjectURL(mineUrl);mineUrl=null}minePlaying=null}
let mineOpen=null,mineRen=null;
const TYPE_IC={ring:'bell',text:'message',alarm:'alarm'},TYPE_K={ring:'mRing',text:'mText',alarm:'mAlarm'};
/* "edit again": decode the saved MP3 and open it in the editor like any other song */
async function editAgain(r){stopMine();mineOpen=null;renderMine();try{const c=ensureCtx(),ab=r.data?r.data.slice(0):await mineBlob(r).arrayBuffer();
  const buf=await new Promise((res,rej)=>{const p=c.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
  if(r.type&&r.type!==S.mode)setMode(r.type,false);await useSong(buf,r.name,'mine',()=>t('mineBadge'));track('mine_edit')}catch(e){say(t('sOpenFail'))}}
function renderMine(){
  const ul=$('mineList');ul.textContent='';$('mine').hidden=false;$('mineEmpty').hidden=!!mine.length;
  const btn=(txt,cls,fn,aria,ic)=>{const b=document.createElement('button');b.type='button';b.className=(txt?'btn':'iconbtn sm')+(cls?' '+cls:'');b.innerHTML=(ic?svg(ic,'sm'):'')+(txt?'<span></span>':'');if(txt)b.querySelector('span').textContent=txt;if(aria)b.setAttribute('aria-label',aria);b.addEventListener('click',fn);return b};
  mine.forEach(r=>{
    const type=r.type||'ring',li=document.createElement('li');li.className='snip'+(r.fav?' fav':'');
    const top=document.createElement('div');top.className='stop';
    const star=btn('','star',async()=>{r.fav=!r.fav;try{await putRec(r)}catch(e){}sortMine();renderMine();track('mine_fav',{on:r.fav})},(r.fav?t('mineUnfav'):t('mineFav'))+': '+r.name,'star');
    star.setAttribute('aria-pressed',String(!!r.fav));top.appendChild(star);
    const nm=document.createElement('span');nm.className='mname';
    if(mineRen===r.id){const inp=document.createElement('input');inp.className='ren';inp.value=r.name;inp.maxLength=40;inp.setAttribute('aria-label',t('mineRename'));
      const done=async ok=>{if(mineRen!==r.id)return;mineRen=null;const v=inp.value.trim().replace(/[\\/:*?"<>|%]/g,'');if(ok&&v&&v!==r.name){r.name=v;try{await putRec(r)}catch(e){}track('mine_renamed')}renderMine()};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(true)}else if(e.key==='Escape')done(false)});inp.addEventListener('blur',()=>done(true));
      nm.appendChild(inp);setTimeout(()=>{inp.focus();inp.select()},0)}
    else{const bd=document.createElement('bdi');bd.textContent=r.name;nm.appendChild(bd)}
    const sm=document.createElement('small');sm.innerHTML=svg(TYPE_IC[type],'xs')+'<span></span>';sm.querySelector('span').textContent=t(TYPE_K[type])+' · '+r.secs.toFixed(1)+' '+t('sec')+' · '+new Date(r.id).toLocaleDateString(lang==='he'?'he-IL':'en-US');nm.appendChild(sm);top.appendChild(nm);li.appendChild(top);
    const row=document.createElement('div');row.className='srow';
    const playing=minePlaying===r.id;
    row.appendChild(btn(playing?t('mineStop'):t('minePlay'),'',()=>{
      const was=minePlaying===r.id;stopMine();stopPreview();
      if(!was){mineUrl=URL.createObjectURL(mineBlob(r));mineAudio=new Audio(mineUrl);minePlaying=r.id;mineAudio.onended=()=>{stopMine();renderMine()};mineAudio.play().catch(()=>{});track('mine_played')}
      renderMine()},(playing?t('mineStop'):t('minePlay'))+': '+r.name,playing?'pause':'play'));
    if(navigator.share&&!ANDROID)row.appendChild(btn(t('mineSet'),'primary',async()=>{track('mine_set_tapped');try{await navigator.share({files:[mineFile(r)]});track('export_completed',{method:'share',from:'mine',mode:r.type||'ring',seconds:Math.round(r.secs)})}catch(e){}},t('setRt')+': '+r.name,'phone'));
    row.appendChild(btn(t('mineDl'),ANDROID||!navigator.share?'primary':'',()=>{const u=URL.createObjectURL(mineBlob(r)),a=document.createElement('a');a.href=u;a.download=r.name.replace(/:/g,'.')+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);track('export_completed',{method:'download',mode:r.type||'ring',seconds:Math.round(r.secs),from:'mine'})},t('mineDl')+': '+r.name,'download'));
    if(row.children.length===3)row.classList.add('three');
    const more=btn('','more',()=>{mineOpen=mineOpen===r.id?null:r.id;renderMine()},t('mineMore')+': '+r.name,'more');more.setAttribute('aria-expanded',String(mineOpen===r.id));row.appendChild(more);
    li.appendChild(row);
    if(mineOpen===r.id){const x=document.createElement('div');x.className='srow extra';
      x.appendChild(btn(t('mineRename'),'',()=>{mineRen=r.id;mineOpen=null;renderMine()},0,'edit'));
      x.appendChild(btn(t('mineEdit'),'',()=>editAgain(r),0,'sliders'));
      x.appendChild(btn(t('mineDup'),'',async()=>{const c={...r,id:Date.now(),name:(r.name+' '+t('mineCopy')).slice(0,40),fav:false};try{await putRec(c)}catch(e){}mine.push(c);await prune();sortMine();mineOpen=null;renderMine();track('mine_dup')},0,'copy'));
      x.appendChild(btn(t('mineDel'),'danger del',async()=>{if(!confirm(t('mineDelQ').replace('{n}',r.name)))return;if(minePlaying===r.id)stopMine();
        try{await dbDo('readwrite',st=>st.delete(r.id))}catch(e){}mine=mine.filter(z=>z.id!==r.id);mineOpen=null;renderMine();track('mine_deleted')},t('mineDel')+': '+r.name,'trash'));
      li.appendChild(x)}
    ul.appendChild(li);
  });
}
loadMine();
/* offline: the app keeps working without a connection once it has been opened */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('offline',()=>track('went_offline'));

initConsent();
['guideLink','helpGuide','helpOther','helpVideo'].forEach(id=>$(id).addEventListener('click',()=>track('installation_guide_opened',{where:id})));
song=demoSong();song._demo=true;$('songLen').textContent=fmtShort(song.duration);analyse();ruler();applyLang();setMode('ring');setDevice(ANDROID?'android':'iphone',false);say(t('sReady0'));
})();
