<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="description" content="SnipRing turns any song into an iPhone ringtone. Pick a song, it finds the chorus, and one tap makes it your ringtone.">
<meta property="og:title" content="SnipRing">
<meta property="og:description" content="Turn any song into an iPhone ringtone. No app, no computer.">

<meta property="og:url" content="https://snipring.com/">
<meta property="og:image" content="https://snipring.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnipRing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232546F0'/%3E%3Cpath d='M14 34h4m6-10v20m6-26v32m6-22v12m6-18v24m6-14v4' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
/* Layout: one editing bench — waveform with a 30-second window you slide, then trim settings and one export button. */
:root{
  --bg:#EEF1F6; --paper:#F9FAFD; --ink:#121A2B; --muted:#5B6680; --line:#CDD4E2; --well:#DCE2EC;
  --accent:#2546F0; --accent-ink:#FFFFFF; --accent-soft:rgba(37,70,240,.13); --wave:#9AA6C0;
  --display:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1A; --paper:#121828; --ink:#E7ECF6; --muted:#8D98B3; --line:#263049; --well:#1D2539;
  --accent:#7088FF; --accent-ink:#0B0F1A; --accent-soft:rgba(112,136,255,.18); --wave:#46536F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --paper:#121828; --ink:#E7ECF6; --muted:#8D98B3; --line:#263049; --well:#1D2539;
  --accent:#7088FF; --accent-ink:#0B0F1A; --accent-soft:rgba(112,136,255,.18); --wave:#46536F; color-scheme:dark}

*{box-sizing:border-box}
html body{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
a.btn{text-decoration:none;display:inline-block}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,72px);line-height:.9;margin:0;text-wrap:balance}
header h1{text-align:start}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
header .logo{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
header .logo:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
header .ring{color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;color:var(--muted);flex:1 1 220px;min-width:0;font-size:13.5px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

.deck{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.song{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stitle{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.sname{font-family:var(--display);font-size:34px;line-height:1;overflow-wrap:anywhere}
.rtname{display:flex;flex-direction:column;gap:4px;flex:1 1 100%}
.rtname input{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.rtname input:focus{outline:2px solid var(--accent);outline-offset:1px}
.song label{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.song input{font-family:var(--display);font-size:34px;line-height:1;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);padding:2px 0;width:100%}
.song input:focus{outline:none;border-bottom-color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.wavebox{position:relative;direction:ltr;border-radius:10px;background:var(--well);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:132px;cursor:grab}
.ruler{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--muted)}

.sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;justify-content:center}
.sel .time{font-size:22px;min-width:7.5ch;text-align:center}
.sel .arrow{color:var(--muted)}
.nudge{font:inherit;font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px;fill:currentColor}

.hint{margin:0;font-size:12.5px;color:var(--muted)}
.trim{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.tlabel{font-weight:600;min-width:3.5em}
.tgroup{display:flex;align-items:center;gap:4px;direction:ltr}
.tgroup .time{font-size:18px;min-width:6ch;text-align:center}
.trow .nudge{padding:6px 8px}
.mark{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.listen{display:flex;gap:10px;flex-wrap:wrap}
.listen .btn{flex:1 1 150px}
.ttime{display:flex;flex-direction:column;gap:6px}
.tinrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tin{display:flex;align-items:center;gap:4px}
.tin input{font-family:var(--mono);font-size:20px;width:4.2ch;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.tin input#ts{width:5ch}
.tin input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lenbox{display:flex;flex-direction:column;gap:8px}
.lenhead{display:flex;justify-content:space-between;align-items:baseline}
.lenhead b{font-size:18px}
#lenR{width:100%;accent-color:var(--accent)}
.range{margin:0;font-size:16px}
.range b{font-size:18px}
.fine{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fine summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.fine[open]{display:flex;flex-direction:column;gap:10px}
.fine[open] summary{margin-bottom:2px}
.tfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tinfo{font-size:14px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.chip .num{font-size:12px;color:var(--muted)}
.chip.sel-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel-on .num{color:var(--accent-ink)}

.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .row{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;align-items:center;gap:8px;padding-top:16px;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}

.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,label.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.export{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;position:sticky;bottom:0;z-index:5;background:var(--paper);margin-inline:-14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.export .btn{flex:1 1 auto}
.export .status{flex:1 1 100%;margin:0}
.a2hs{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px}
.a2hs p{margin:0;flex:1;font-size:14px;line-height:1.45}
.a2hs-icon{color:var(--accent);flex:none;display:grid}
.a2hs-x{flex:none;font:inherit;font-size:16px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.sitefoot{text-align:center;font-size:13px;color:var(--muted);padding-block:8px 24px}
.sitefoot a{color:var(--muted)}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
main:focus{outline:none}
.hbtns{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.hrow{flex-wrap:wrap}
#a11yBtn{display:flex;align-items:center;gap:6px}
.wavebox:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a:focus-visible,.chip:focus-visible,.nudge:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.a11y{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.a11y-head{display:flex;justify-content:space-between;align-items:center}
.a11y-head h2{font-family:var(--body);font-size:17px;margin:0}
.a11y-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.a11y-opt{font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.a11y-opt b{font-size:18px}
.a11y-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.a11y a{color:var(--accent);font-size:14px}
/* accessibility modes */
html.a-bigger{font-size:125%}
html.a-bigger body{font-size:18.75px}
html:root.a-contrast:not([data-none]){--bg:#000;--paper:#000;--ink:#fff;--muted:#e6e6e6;--line:#fff;--well:#111;--accent:#ffd400;--accent-ink:#000;--accent-soft:rgba(255,212,0,.22);--wave:#9a9a9a;color-scheme:dark}
html.a-links a{text-decoration:underline!important;text-underline-offset:3px;font-weight:700}
html.a-still *,html.a-still *::before,html.a-still *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.a-readable body,html.a-readable input,html.a-readable button,html.a-readable select{font-family:Arial,"Arial Hebrew",Helvetica,sans-serif!important;letter-spacing:.02em;word-spacing:.08em}
html.a-readable h1,html.a-readable .sname{font-family:Arial,"Arial Hebrew",Helvetica,sans-serif!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.invite{flex:1 1 100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px}
.invite p{margin:0;flex:1 1 200px;font-size:14px}
.invite .btn{flex:0 0 auto}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:36px 1fr;column-gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.steps li::before{content:counter(st);grid-row:span 2;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--mono)}
.steps b{font-size:15px}
.steps span{font-size:13px;color:var(--muted)}
.btn.big{font-size:17px;padding:14px 24px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 0}
.adv .controls{margin-top:12px}
.status{font-size:13.5px;color:var(--muted);margin:0;flex:1 1 220px;min-width:0}

.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.guide section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.guide h3{margin:0 0 8px;font-size:16px}
.guide ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted);margin:0}
.mine{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.minehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.minehead h2{margin:0;font-size:18px}
.mine ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mine li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.mine li:first-child{border-top:0}
.mine .mname{flex:1 1 140px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mine .mname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mine .mb{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.mine .mb.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mine .mb.del{color:var(--muted)}
code{font-family:var(--mono);font-size:.9em;direction:ltr;unicode-bidi:embed}
</style>

</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<div class="wrap" dir="rtl">
  <header>
    <div class="hrow"><h1 dir="ltr"><a class="logo" href="./" aria-label="SnipRing">Snip<span class="ring">Ring</span></a></h1><span class="hbtns"><button class="langbtn" id="a11yBtn" type="button" aria-haspopup="dialog" aria-controls="a11yPanel" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="4.5" r="2" fill="currentColor"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5m0 0l-3.5 6M12 15l3.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="a11y"></span></button><button class="langbtn" id="lang" type="button" lang="en">English</button></span></div>
    <p data-i18n="tagline"></p>
  </header>

  <div class="a11y" id="a11yPanel" role="dialog" aria-modal="false" aria-labelledby="a11yTitle" hidden>
    <div class="a11y-head"><h2 id="a11yTitle" data-i18n="a11y"></h2><button class="a2hs-x" id="a11yClose" type="button" data-i18n-aria="close">✕</button></div>
    <div class="a11y-grid">
      <button type="button" class="a11y-opt" data-a="bigger" aria-pressed="false"><b>A+</b><span data-i18n="aBig"></span></button>
      <button type="button" class="a11y-opt" data-a="contrast" aria-pressed="false"><b>◐</b><span data-i18n="aContrast"></span></button>
      <button type="button" class="a11y-opt" data-a="links" aria-pressed="false"><b><u>ab</u></b><span data-i18n="aLinks"></span></button>
      <button type="button" class="a11y-opt" data-a="still" aria-pressed="false"><b>❚❚</b><span data-i18n="aStill"></span></button>
      <button type="button" class="a11y-opt" data-a="readable" aria-pressed="false"><b>Aa</b><span data-i18n="aFont"></span></button>
      <button type="button" class="a11y-opt" id="a11yReset"><b>↺</b><span data-i18n="aReset"></span></button>
    </div>
    <a href="accessibility.html" data-i18n="aStatement"></a>
  </div>

<main id="main" tabindex="-1">
  <div class="a2hs" id="a2hs" hidden>
    <span class="a2hs-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <p data-i18n="a2hs"></p>
    <button class="a2hs-x" id="a2hsX" type="button" data-i18n-aria="close">✕</button>
  </div>

  <ol class="steps" id="steps">
    <li><b data-i18n="step1"></b><span data-i18n="step1s"></span></li>
    <li><b data-i18n="step2"></b><span data-i18n="step2s"></span></li>
    <li><b data-i18n="step3"></b><span data-i18n="step3s"></span></li>
  </ol>

  <div class="drop" id="drop">
    <label class="btn primary file big"><span data-i18n="pick"></span><input type="file" id="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.flac,.ogg,.mp4,.mov,.m4v"></label>
    <p data-i18n="pickNote"></p>
    <button class="linkbtn" id="tryDemo" type="button" data-i18n="tryDemo"></button>
  </div>

  <div class="deck" id="editor" hidden>
    <h2 class="sr" data-i18n="editorH"></h2>
    <div class="song">
      <div class="stitle"><span class="lbl" data-i18n="song"></span><span class="sname" id="songTitle"></span></div>
      <span class="badge" id="badge"></span>
      <span class="badge num" id="songLen">0:00</span>
    </div>

    <div>
      <div class="wavebox" id="wavebox" role="slider" tabindex="0" aria-valuemin="0" data-i18n-aria="waveAria"><canvas id="wave" aria-hidden="true"></canvas></div>
      <div class="ruler num" id="ruler"></div>
    </div>

    <div class="field"><span class="lbl" data-i18n="cands"></span><div class="chips" id="cands"></div></div>

    <p class="hint" data-i18n="howStart"></p>

    <div class="listen">
      <button class="btn" id="playFrom"><span id="playFromT"></span> <span class="num" id="cursorT">0:00</span></button>
      <button class="btn primary" id="startHere" data-i18n="startHere"></button>
    </div>
    <div class="ttime">
      <label class="lbl" for="tm" data-i18n="typeTime"></label>
      <div class="tinrow">
        <span class="tin" dir="ltr"><input id="tm" type="number" inputmode="numeric" min="0" placeholder="0" data-i18n-aria="min"><b>:</b><input id="ts" type="number" inputmode="decimal" min="0" max="59.9" step="0.1" placeholder="00" data-i18n-aria="secs"></span>
        <button class="btn" id="goTime" data-i18n="goTime"></button>
      </div>
    </div>

    <div class="lenbox">

<script>
(() => {
const $=id=>document.getElementById(id);
const ANDROID=/Android/i.test(navigator.userAgent);
if(ANDROID)document.documentElement.classList.add('android');
let ctx=null, song=null, peaks=null, energy=null, FR=10; // energy frames per second
const S={cursor:0,start:0,len:29,fin:.5,fout:2,norm:true,cand:0};
let cands=[];

function ensureCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
const fmtShort=t=>{const m=Math.floor(t/60),s=Math.floor(t-m*60);return m+':'+(s<10?'0':'')+s};
function say(t){$('status').textContent=t}
/* analytics: anonymous funnel events, no cookies; no-op until the Umami script is present */
function track(name,data){try{window.umami&&window.umami.track(name,data)}catch(e){}}

/* ---------- demo song (synthetic, so the page works before a file is chosen) ---------- */
function demoSong(){
  const sr=44100,dur=72,n=sr*dur,L=new Float32Array(n),R=new Float32Array(n);
  const beat=.5; // 120 BPM
  const add=(t,f,amp,dec,pan=0)=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*dec*5));
    for(let i=0;i<len;i++){const x=i/sr,v=amp*Math.sin(2*Math.PI*f*x)*Math.exp(-x/dec)*Math.min(1,x/.004);L[s0+i]+=v*(1-pan);R[s0+i]+=v*(1+pan)}};
  const kick=t=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*.25));let ph=0;
    for(let i=0;i<len;i++){const x=i/sr;ph+=2*Math.PI*(50+90*Math.exp(-x/.03))/sr;const v=.55*Math.sin(ph)*Math.exp(-x/.08);L[s0+i]+=v;R[s0+i]+=v}};
  const hat=t=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*.05));for(let i=0;i<len;i++){const v=.12*(Math.random()*2-1)*Math.exp(-i/sr/.012);L[s0+i]+=v*.7;R[s0+i]+=v*1.3}};
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const prog=[57,53,48,55]; // A F C G
  const mel=[76,0,81,0,79,76,74,0, 76,0,72,74,76,0,0,0, 76,0,81,0,79,76,74,0, 79,76,74,72,69,0,0,0];
  const sections=[[0,8,'intro'],[8,28,'verse'],[28,44,'chorus'],[44,56,'verse'],[56,72,'chorus']];
  for(const [a,b,kind] of sections){
    for(let t=a;t<b;t+=beat/2){
      const step=Math.round((t-a)/(beat/2)),bar=Math.floor(t/2)%4,root=prog[bar];
      if(step%8===0)[0,4,7].forEach((iv,k)=>add(t,hz(root+12+iv),kind==='intro'?.05:.07,1.2,k-1));
      if(kind!=='intro'&&step%4===0)add(t,hz(root-12),kind==='chorus'?.32:.22,.35);
      if(kind==='verse'&&step%2===1)add(t,hz(root+24+[0,7,12][step%3]),.06,.2,.5);
      if(kind==='chorus'){const m=mel[step%32];if(m)add(t,hz(m),.24,.45,-.2);if(step%4===0)kick(t);if(step%2===1)hat(t);}
    }
  }
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));
  for(let i=0;i<n;i++){L[i]*=.9/pk;R[i]*=.9/pk}
  return {sampleRate:sr,length:n,duration:dur,numberOfChannels:2,getChannelData:c=>c?R:L};
}

/* ---------- analysis ---------- */
function analyse(){
  const ch=song.numberOfChannels,n=song.length,sr=song.sampleRate;
  const a=song.getChannelData(0),b=ch>1?song.getChannelData(1):a;
  const P=1200;peaks=new Float32Array(P);
  const bs=Math.max(1,Math.floor(n/P));
  for(let p=0;p<P;p++){let m=0;const e=Math.min(n,(p+1)*bs);for(let i=p*bs;i<e;i+=4){const v=Math.abs(a[i])+Math.abs(b[i]);if(v>m)m=v}peaks[p]=m/2}
  const hop=Math.floor(sr/FR),F=Math.floor(n/hop);energy=new Float32Array(F);
  for(let f=0;f<F;f++){let s=0;const o=f*hop;for(let i=0;i<hop;i+=2){const v=(a[o+i]+b[o+i])/2;s+=v*v}energy[f]=Math.sqrt(s/(hop/2))}
  findCandidates();
}
const MAXLEN=29.5,MINLEN=3,DEFLEN=29;
/* Chorus finder: chroma self-similarity + loudness.
   A chorus is the loud part of a song that repeats, so we look for the window
   whose harmony recurs elsewhere in the song most strongly. */
function fftMag(re, im) { // in-place radix-2, returns nothing
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

function songFeatures(song, hopSec) {
  const sr0 = song.sampleRate, a = song.getChannelData(0), b = song.numberOfChannels > 1 ? song.getChannelData(1) : a;
  const dec = Math.max(1, Math.round(sr0 / 11025)), sr = sr0 / dec;
  const n = Math.floor(song.length / dec), x = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; const o = i * dec; for (let k = 0; k < dec; k++) s += a[o + k] + b[o + k]; x[i] = s / (2 * dec); }
  const N = 4096, hop = Math.round(sr * hopSec), F = Math.max(1, Math.floor((n - N) / hop) + 1);
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const pc = new Int8Array(N / 2).fill(-1);
  for (let k = 1; k < N / 2; k++) { const f = k * sr / N; if (f >= 80 && f <= 4000) pc[k] = ((Math.round(12 * Math.log2(f / 440)) + 69) % 12 + 12) % 12; }
  const chroma = new Float32Array(F * 12), rms = new Float32Array(F), re = new Float32Array(N), im = new Float32Array(N);
  for (let f = 0; f < F; f++) {
    const o = f * hop; let e = 0;
    for (let i = 0; i < N; i++) { const v = x[o + i] || 0; e += v * v; re[i] = v * win[i]; im[i] = 0; }
    rms[f] = Math.sqrt(e / N);
    fftMag(re, im);
    const c = chroma.subarray(f * 12, f * 12 + 12);
    for (let k = 1; k < N / 2; k++) if (pc[k] >= 0) c[pc[k]] += Math.hypot(re[k], im[k]);
    let mx = 0; for (let i = 0; i < 12; i++) { c[i] = Math.sqrt(c[i]); mx += c[i] / 12; }
    for (let i = 0; i < 12; i++) c[i] -= mx;              // centre: keep only which notes stand out
    let nn = 0; for (let i = 0; i < 12; i++) nn += c[i] * c[i]; nn = Math.sqrt(nn) || 1;
    for (let i = 0; i < 12; i++) c[i] /= nn;
  }
  return { chroma, rms, F, hopSec };
}

/* returns up to 3 candidate starts (seconds), best first */
function chorusCandidates(song, winSec) {
  const hopSec = 0.5, { chroma, rms, F } = songFeatures(song, hopSec);
  const W = Math.max(4, Math.min(F - 1, Math.round(winSec / hopSec)));
  if (F < W * 2 + 2) return [{ t: 0, score: 0 }];
  // similarity matrix (cosine of unit chroma vectors), contrast-stretched
  const S = new Float32Array(F * F);
  for (let i = 0; i < F; i++) for (let j = i; j < F; j++) {
    let d = 0; for (let k = 0; k < 12; k++) d += chroma[i * 12 + k] * chroma[j * 12 + k];
    d = Math.max(0, d); S[i * F + j] = S[j * F + i] = d;
  }
  // loudness, normalised 0..1
  let rmax = 0; for (let i = 0; i < F; i++) rmax = Math.max(rmax, rms[i]);
  const loud = new Float32Array(F + 1); for (let i = 0; i < F; i++) loud[i + 1] = loud[i] + rms[i] / (rmax || 1);
  const minLag = Math.round(W * 0.8), score = new Float32Array(F - W + 1);
  const sims = new Float32Array(F);
  for (let i = 0; i + W <= F; i++) {
    sims.fill(-1);
    for (let j = 0; j + W <= F; j++) {
      if (Math.abs(i - j) < minLag) continue;
      let v = 0; for (let k = 0; k < W; k++) v += S[(i + k) * F + j + k];
      sims[j] = v / W;
    }
    // the two strongest repeats at clearly different places (a chorus comes back 2-3 times)
    let j1 = -1; for (let j = 0; j < F; j++) if (sims[j] > (j1 < 0 ? -1 : sims[j1])) j1 = j;
    let j2 = -1; for (let j = 0; j < F; j++) if (Math.abs(j - j1) >= minLag && sims[j] > (j2 < 0 ? -1 : sims[j2])) j2 = j;
    const best = Math.max(0, j1 < 0 ? 0 : sims[j1]), second = Math.max(0, j2 < 0 ? 0 : sims[j2]);
    const L = (loud[i + W] - loud[i]) / W;
    score[i] = (best + second) * (0.6 + 0.4 * L);
  }
  const order = [...score.keys()].sort((p, q) => score[q] - score[p]), picked = [];
  for (const i of order) { if (picked.length >= 3) break; if (picked.every(p => Math.abs(p - i) >= W * 0.75)) picked.push(i); }
  return picked.map(i => {
    // snap to the strongest loudness rise within ±3 s (section boundary)
    let bi = i, bd = -1;
    for (let k = Math.max(2, i - 6); k <= Math.min(F - W, i + 6); k++) { const d = (rms[k] + (rms[k + 1] || 0)) - (rms[k - 1] + rms[k - 2]); if (d > bd) { bd = d; bi = k; } }
    return { t: bi * hopSec, score: score[i] };
  });
}

function energyCandidates(){
  const F=energy.length,W=Math.min(F,Math.round(Math.min(DEFLEN,song.duration)*FR));
  const pre=new Float64Array(F+1);for(let i=0;i<F;i++)pre[i+1]=pre[i]+energy[i];
  const mean=(s,w)=>(pre[Math.min(F,s+w)]-pre[Math.max(0,s)])/Math.max(1,Math.min(F,s+w)-Math.max(0,s));
  const scores=[];for(let s=0;s+W<=F;s+=5)scores.push([mean(s,W),s]);
  scores.sort((x,y)=>y[0]-x[0]);
  const picked=[];
  for(const [sc,s] of scores){if(picked.length>=3)break;if(picked.every(p=>Math.abs(p.s-s)>=W*.6))picked.push({sc,s})}
  cands=picked.map(p=>{let best=p.s,bd=-1;
    for(let s=Math.max(0,p.s-50);s<=Math.min(F-W,p.s+50);s++){const d=mean(s,10)-mean(s-10,10);if(d>bd){bd=d;best=s}}
    return {t:best/FR,score:p.sc}});
  return cands;
}
function findCandidates(){
  try{cands=chorusCandidates(song,15)}catch(e){cands=[]}
  if(!cands.length||!cands[0].score)energyCandidates();
  if(!cands.length)cands=[{t:0,score:0}];
  renderCands();pickCand(0);
}
function pickCand(i){S.cand=i;const t=cands[i].t,room=song.duration-t,L=Math.min(DEFLEN,MAXLEN);
  if(room>=Math.min(L,12))setRange(t,t+Math.min(L,room),'start');else setRange(t,t+L,'move');markCand()}
function renderCands(){
  const box=$('cands');box.innerHTML='';
  cands.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';
    b.innerHTML=(i===0?t('chorus'):t('part')+' '+(i+1))+' <span class="num">'+fmtShort(c.t)+'</span>';
    b.addEventListener('click',()=>{pickCand(i);previewSel()});box.appendChild(b)});
}
function markCand(){[...$('cands').children].forEach((b,i)=>{b.classList.toggle('sel-on',i===S.cand);b.setAttribute('aria-pressed',String(i===S.cand))})}

/* selection: start + len, both handles free, length capped below 30 s */
function setRange(a,b,mode){
  const D=song.duration,r=v=>Math.round(v*10)/10;
  if(mode==='move'){const len=Math.min(b-a,MAXLEN,D);a=Math.max(0,Math.min(D-len,a));b=a+len}
  a=Math.max(0,Math.min(D,a));b=Math.max(0,Math.min(D,b));
  if(mode==='start'){ if(b-a>MAXLEN)b=Math.min(D,a+MAXLEN); if(b-a<MINLEN){b=Math.min(D,a+MINLEN);a=Math.max(0,b-MINLEN)} }
  else if(mode==='end'){ if(b-a>MAXLEN)a=Math.max(0,b-MAXLEN); if(b-a<MINLEN){a=Math.max(0,b-MINLEN);b=Math.min(D,a+MINLEN)} }
  S.start=r(a);S.len=Math.max(0,r(b)-r(a));
  $('tStart').textContent=fmt(S.start);$('sumA').textContent=fmt(S.start);$('sumB').textContent=fmt(S.start+S.len);syncTime();$('tEnd').textContent=fmt(S.start+S.len);$('tLen').textContent=S.len.toFixed(1);syncAria();$('lenR').value=S.len;[...$('lens').children].forEach(b=>b.classList.toggle('sel-on',Math.abs(+b.dataset.len-S.len)<.05));
  draw();
}
function syncTime(){const a=document.activeElement;if(a&&(a.id==='tm'||a.id==='ts'))return;
  const m=Math.floor(S.start/60),sec=Math.round((S.start-m*60)*10)/10;$('tm').value=m;$('ts').value=sec<10?'0'+sec:sec}
function syncAria(){const w=$('wavebox');if(!song)return;
  w.setAttribute('aria-valuemax',String(Math.floor(song.duration)));w.setAttribute('aria-valuenow',String(Math.round(S.start)));
  w.setAttribute('aria-valuetext',t('waveVal').replace('{a}',fmt(S.start)).replace('{b}',fmt(S.start+S.len)));
  [...$('lens').children].forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('sel-on'))))}
function setStart(t){setRange(t,t+S.len,'move')}

/* ---------- waveform ---------- */
const cv=$('wave');
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(playT){
  if(!peaks)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const D=song.duration,x0=S.start/D*w,x1=(S.start+S.len)/D*w;
  g.fillStyle=css('--accent-soft');g.fillRect(x0,0,x1-x0,h);
  const wave=css('--wave'),acc=css('--accent'),ink=css('--ink');
  for(let x=0;x<w;x+=2){const p=peaks[Math.floor(x/w*peaks.length)]||0,bh=Math.max(1,p*(h-16));
    g.fillStyle=(x>=x0&&x<=x1)?acc:wave;g.fillRect(x,(h-bh)/2,1.4,bh)}
  for(const x of [x0,x1]){g.fillStyle=acc;g.fillRect(x-1.5,0,3,h);
    g.beginPath();g.roundRect?g.roundRect(x-7,h/2-18,14,36,7):g.rect(x-7,h/2-18,14,36);g.fill();
    g.fillStyle=css('--accent-ink');g.fillRect(x-2.5,h/2-8,1.5,16);g.fillRect(x+1,h/2-8,1.5,16)}
  const ct=playT!=null?playT:S.cursor;
  if(ct!=null){const px=ct/D*w;g.fillStyle=ink;g.fillRect(px-1,0,2,h);g.beginPath();g.moveTo(px-5,0);g.lineTo(px+5,0);g.lineTo(px,7);g.fill()}
}
function ruler(){const D=song.duration,r=$('ruler');r.innerHTML='';for(let i=0;i<=4;i++){const s=document.createElement('span');s.textContent=fmtShort(D*i/4);r.appendChild(s)}}
new ResizeObserver(()=>draw()).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let drag=null;
const tAt=e=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*song.duration};
cv.addEventListener('pointerdown',e=>{

  if(!S.norm)return 1;const sr=song.sampleRate,a=Math.floor(S.start*sr),b=Math.min(song.length,a+Math.floor(S.len*sr));let pk=0;

/* ---------- render + encode ---------- */
function renderClip(){
  const sr=song.sampleRate,a=Math.floor(S.start*sr),n=Math.min(song.length-a,Math.floor(S.len*sr)),k=selGain();
  const fi=Math.floor(S.fin*sr),fo=Math.floor(S.fout*sr),chans=[];
  for(let c=0;c<2;c++){const src=song.getChannelData(Math.min(c,song.numberOfChannels-1)),out=new Float32Array(n);
    for(let i=0;i<n;i++){let env=k;if(i<fi)env*=i/fi;if(i>n-fo)env*=(n-i)/fo;out[i]=src[a+i]*env}chans.push(out)}

function toMp3(clip){

    const i16=a=>{const r=new Int16Array(a.length);for(let i=0;i<a.length;i++)r[i]=Math.max(-1,Math.min(1,a[i]))*32767;return r};
    const L=i16(clip.chans[0]),R=i16(clip.chans[1]);

    const len=out.reduce((s,a)=>s+a.length,0),res=new Uint8Array(len);let p=0;for(const a of out){res.set(a,p);p+=a.length}

/* ID3v2.3 title tag (UTF-16) so the ringtone keeps the chosen name */

  u.forEach((c,i)=>{body[3+i*2]=c&255;body[4+i*2]=c>>8});

  const n=body.length;frame.set([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255],4);frame.set(body,10);
  const size=frame.length,tag=new Uint8Array(10+size);tag.set([73,68,51,3,0,0],0);
  tag.set([(size>>21)&127,(size>>14)&127,(size>>7)&127,size&127],6);tag.set(frame,10);return tag;

let lang=(()=>{try{const v=localStorage.getItem('snipring-lang');if(v==='he'||v==='en')return v}catch(e){}return /^he|^iw/i.test(navigator.language||'')?'he':'en'})();
/* Android gets its own wording wherever a key has an "_A" twin */
const t=k=>(ANDROID&&T[lang]&&T[lang][k+'_A'])||(T[lang]&&T[lang][k])||T.en[k]||k;
function applyLang(){
  const html=document.documentElement,rtl=lang==='he';html.lang=lang;html.dir=rtl?'rtl':'ltr';document.querySelector('.wrap').dir=rtl?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  $('lang').textContent=t('langBtn');$('guideLink').href=ANDROID?(lang==='he'?'ringtone-android.html':'android-ringtone.html'):(lang==='he'?'ringtone-iphone.html':'iphone-ringtone.html');
  if(song&&song._demo){$('songTitle').textContent=t('sample');$('badge').textContent=t('sampleBadge');if(!$('name').dataset.touched)$('name').value=t('sample')}
  $('finV').textContent=S.fin.toFixed(1)+' '+t('sec');$('foutV').textContent=S.fout.toFixed(1)+' '+t('sec');
  if(cands.length)renderCands(),markCand();setIcon();syncAria();if(typeof renderMine==='function')renderMine();
}
function openEditor(){const ed=$('editor'),was=ed.hidden;ed.hidden=false;$('steps').hidden=true;
  requestAnimationFrame(()=>{draw();if(was){const calm=matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.classList.contains('a-still');ed.scrollIntoView({behavior:calm?'auto':'smooth',block:'start'});$('main').focus({preventScroll:true})}})}
$('dl').addEventListener('click',()=>{track('mp3_downloaded');setTimeout(showInvite,1500)});
function showInvite(){let seen=false;try{seen=sessionStorage.getItem('snipring-inv')==='1'}catch(e){}
  if(seen)return;$('invite').hidden=false;track('invite_shown');try{sessionStorage.setItem('snipring-inv','1')}catch(e){}}
$('inviteBtn').addEventListener('click',async()=>{
  const url='https://snipring.com/?ref=invite',text=t('invText');track('invite_tapped');
  if(navigator.share){try{await navigator.share({title:'SnipRing',text,url});track('invite_shared');$('invite').hidden=true}catch(e){}return}
  try{await navigator.clipboard.writeText(text+' '+url);say(t('invCopied'))}catch(e){location.href='https://wa.me/?text='+encodeURIComponent(text+' '+url)}
});
/* home screen: hint for iPhone Safari users who haven't added it yet */
(()=>{const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  if(standalone){track('opened_from_home_screen');return}
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let dismissed=false;try{dismissed=localStorage.getItem('snipring-a2hs')==='1'}catch(e){}
  if(ios&&!dismissed){$('a2hs').hidden=false}
  $('a2hsX').addEventListener('click',()=>{$('a2hs').hidden=true;try{localStorage.setItem('snipring-a2hs','1')}catch(e){}track('a2hs_hint_closed')});
})();
/* accessibility panel: settings saved on this device */
(()=>{const KEY='snipring-a11y',opts=['bigger','contrast','links','still','readable'],root=document.documentElement;
  let on={};try{on=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  const paint=()=>{opts.forEach(o=>root.classList.toggle('a-'+o,!!on[o]));
    document.querySelectorAll('.a11y-opt[data-a]').forEach(b=>b.setAttribute('aria-pressed',String(!!on[b.dataset.a])));
    try{localStorage.setItem(KEY,JSON.stringify(on))}catch(e){}draw()};
  const open=v=>{$('a11yPanel').hidden=!v;$('a11yBtn').setAttribute('aria-expanded',String(v));if(v)$('a11yClose').focus();else $('a11yBtn').focus()};
  $('a11yBtn').addEventListener('click',()=>open($('a11yPanel').hidden));
  $('a11yClose').addEventListener('click',()=>open(false));
  $('a11yPanel').addEventListener('keydown',e=>{if(e.key==='Escape')open(false)});
  document.querySelectorAll('.a11y-opt[data-a]').forEach(b=>b.addEventListener('click',()=>{on[b.dataset.a]=!on[b.dataset.a];paint();track('a11y_toggle',{option:b.dataset.a,on:!!on[b.dataset.a]})}));
  $('a11yReset').addEventListener('click',()=>{on={};paint()});
  paint();
})();

$('lang').addEventListener('click',()=>{lang=lang==='he'?'en':'he';try{localStorage.setItem('snipring-lang',lang)}catch(e){}applyLang();track('language_switched',{to:lang});say(t('sReady0'))});
$('name').addEventListener('input',()=>{$('name').dataset.touched='1'});
/* ---------- my ringtones: kept in IndexedDB on this device only ---------- */
let mine=[],mineAudio=null,mineUrl=null,minePlaying=null;
function db(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('snipring',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('rings',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbDo(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('rings',mode),st=tx.objectStore('rings'),out=fn(st);
  tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)})}
async function loadMine(){try{const all=await dbDo('readonly',st=>st.getAll());mine=(all||[]).sort((a,b)=>b.id-a.id)}catch(e){mine=[]}renderMine()}
async function saveMine(file,secs){
  try{// stored as a plain ArrayBuffer: Safari has been unreliable with Blobs inside IndexedDB
    const data=await file.arrayBuffer();
    const rec={id:Date.now(),name:file.name.replace(/\.mp3$/i,''),secs:Math.round(secs*10)/10,data};
    if(mine[0]&&mine[0].name===rec.name&&mine[0].data.byteLength===data.byteLength){say($('status').textContent+' '+t('mineSaved'));return}
    await dbDo('readwrite',st=>st.put(rec));mine.unshift(rec);
    while(mine.length>20){const old=mine.pop();await dbDo('readwrite',st=>st.delete(old.id))}
    renderMine();say($('status').textContent+' '+t('mineSaved'));
  }catch(e){track('mine_save_failed',{err:String(e&&e.name||e)})}
}
const mineBlob=r=>r.blob||new Blob([r.data],{type:'audio/mpeg'});
function mineFile(r){return new File([mineBlob(r)],r.name+'.mp3',{type:'audio/mpeg'})}
function stopMine(){if(mineAudio){mineAudio.pause();mineAudio=null}if(mineUrl){URL.revokeObjectURL(mineUrl);mineUrl=null}minePlaying=null}
function renderMine(){
  const ul=$('mineList');ul.textContent='';$('mine').hidden=false;$('mineEmpty').hidden=!!mine.length;
  const btn=(txt,cls,fn,aria)=>{const b=document.createElement('button');b.type='button';b.className='mb'+(cls?' '+cls:'');b.textContent=txt;if(aria)b.setAttribute('aria-label',aria);b.addEventListener('click',fn);return b};
  mine.forEach(r=>{
    const li=document.createElement('li'),nm=document.createElement('span');nm.className='mname';nm.textContent=r.name;
    const sm=document.createElement('small');sm.textContent=r.secs.toFixed(1)+' '+t('sec')+' · '+new Date(r.id).toLocaleDateString(lang==='he'?'he-IL':'en-US');nm.appendChild(sm);li.appendChild(nm);
    const playing=minePlaying===r.id;
    li.appendChild(btn(playing?t('mineStop'):t('minePlay'),'',()=>{
      const was=minePlaying===r.id;stopMine();stopPreview();
      if(!was){mineUrl=URL.createObjectURL(mineBlob(r));mineAudio=new Audio(mineUrl);minePlaying=r.id;mineAudio.onended=()=>{stopMine();renderMine()};mineAudio.play().catch(()=>{});track('mine_played')}
      renderMine()},(playing?t('mineStop'):t('minePlay'))+': '+r.name));
    if(navigator.share&&!ANDROID)li.appendChild(btn(t('mineSet'),'pri',async()=>{track('mine_set_tapped');try{await navigator.share({files:[mineFile(r)]});track('share_completed',{from:'mine'})}catch(e){}},t('setRt')+': '+r.name));
    li.appendChild(btn(t('mineDl'),ANDROID||!navigator.share?'pri':'',()=>{const u=URL.createObjectURL(mineBlob(r)),a=document.createElement('a');a.href=u;a.download=r.name+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);track('mp3_downloaded',{from:'mine'})},t('mineDl')+': '+r.name));
    li.appendChild(btn(t('mineDel'),'del',async()=>{if(!confirm(t('mineDelQ').replace('{n}',r.name)))return;if(minePlaying===r.id)stopMine();
      try{await dbDo('readwrite',st=>st.delete(r.id))}catch(e){}mine=mine.filter(x=>x.id!==r.id);renderMine();track('mine_deleted')},t('mineDel')+': '+r.name));
    ul.appendChild(li);
  });
}
loadMine();
/* ---------- start with the demo ---------- */
song=demoSong();song._demo=true;$('songLen').textContent=fmtShort(song.duration);analyse();ruler();applyLang();say(t('sReady0'));
})();
