<style>
/* Layout: one editing bench — waveform with a 30-second window you slide, then trim settings and one export button. */
:root{
  --bg:#EEF1F6; --paper:#F9FAFD; --ink:#121A2B; --muted:#5B6680; --line:#CDD4E2; --well:#DCE2EC;
  --accent:#2546F0; --accent-ink:#FFFFFF; --accent-soft:rgba(37,70,240,.13); --wave:#9AA6C0;
  --display:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1A; --paper:#121828; --ink:#E7ECF6; --muted:#8D98B3; --line:#263049; --well:#1D2539;
  --accent:#7088FF; --accent-ink:#0B0F1A; --accent-soft:rgba(112,136,255,.18); --wave:#46536F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --paper:#121828; --ink:#E7ECF6; --muted:#8D98B3; --line:#263049; --well:#1D2539;
  --accent:#7088FF; --accent-ink:#0B0F1A; --accent-soft:rgba(112,136,255,.18); --wave:#46536F; color-scheme:dark}

*{box-sizing:border-box}
html body{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
a.btn{text-decoration:none;display:inline-block}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,72px);line-height:.9;margin:0;text-wrap:balance}
header h1{text-align:start}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
header .logo{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
header .logo:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
header .ring{color:var(--accent)}
header p{display:none}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

main{display:flex;flex-direction:column;gap:18px}
main:focus{outline:none}
/* hero: the upload card is the first and biggest thing on the page */
.drop{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;
  padding:34px 22px 26px;border-radius:26px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 0%,var(--accent-soft),transparent 65%),var(--paper);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 40px -24px rgba(18,26,43,.35)}
.drop::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,var(--accent),transparent 40%,transparent 60%,var(--accent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.drop.over{background:var(--accent-soft)}
.drop .viz{display:flex;align-items:center;gap:5px;height:54px;direction:ltr}
.drop .viz i{display:block;width:6px;border-radius:3px;background:var(--accent);opacity:.35;height:18px;animation:eq 1.6s ease-in-out infinite}
.drop .viz i:nth-child(n+5):nth-child(-n+9){opacity:1}
.drop .viz i:nth-child(1){animation-delay:-.2s;height:14px}.drop .viz i:nth-child(2){animation-delay:-.9s;height:24px}.drop .viz i:nth-child(3){animation-delay:-.5s;height:20px}
.drop .viz i:nth-child(4){animation-delay:-1.1s;height:30px}.drop .viz i:nth-child(5){animation-delay:-.3s;height:42px}.drop .viz i:nth-child(6){animation-delay:-1.3s;height:54px}
.drop .viz i:nth-child(7){animation-delay:-.7s;height:46px}.drop .viz i:nth-child(8){animation-delay:-1.5s;height:52px}.drop .viz i:nth-child(9){animation-delay:-.1s;height:38px}
.drop .viz i:nth-child(10){animation-delay:-.8s;height:28px}.drop .viz i:nth-child(11){animation-delay:-1.2s;height:22px}.drop .viz i:nth-child(12){animation-delay:-.4s;height:16px}.drop .viz i:nth-child(13){animation-delay:-1s;height:12px}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.droph{font-size:clamp(40px,11vw,60px);line-height:.95;margin:2px 0 0;text-wrap:balance}
.dropsub{margin:0;color:var(--muted);font-size:15.5px;max-width:34ch}
.drop .file.big{width:100%;max-width:380px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;padding:17px 24px;border-radius:16px;margin-top:6px;
  box-shadow:0 12px 28px -12px var(--accent)}
.trust{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px}
.trust li{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.linkbtn.nofile{font-weight:700;font-size:15px}
.dropnote{margin:0;color:var(--muted);font-size:12.5px;max-width:42ch}
/* once a song is open, the hero shrinks to a slim "choose another" bar */
main.editing .drop{flex-direction:row;flex-wrap:wrap;justify-content:center;text-align:start;padding:12px 14px;gap:10px;border-radius:16px;box-shadow:none}
main.editing .drop #noFile,main.editing .drop .watch,main.editing .drop .viz,main.editing .drop .droph,main.editing .drop .dropsub,main.editing .drop .trust,main.editing .drop .dropnote{display:none}
main.editing .drop .file.big{width:auto;margin:0;font-size:15px;padding:10px 18px;box-shadow:none;border-radius:12px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

.deck{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px}
.song{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stitle{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.sname{font-family:var(--display);font-size:34px;line-height:1;overflow-wrap:anywhere}
.rtname{display:flex;flex-direction:column;gap:4px;flex:1 1 100%}
.rtname input{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.rtname input:focus{outline:2px solid var(--accent);outline-offset:1px}
.song label{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.song input{font-family:var(--display);font-size:34px;line-height:1;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);padding:2px 0;width:100%}
.song input:focus{outline:none;border-bottom-color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.wavebox{position:relative;direction:ltr;border-radius:10px;background:var(--well);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:132px;cursor:grab}
.ruler{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--muted)}

.sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;justify-content:center}
.sel .time{font-size:22px;min-width:7.5ch;text-align:center}
.sel .arrow{color:var(--muted)}
.nudge{font:inherit;font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px;fill:currentColor}

.hint{margin:0;font-size:12.5px;color:var(--muted)}
.trim{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.tlabel{font-weight:600;min-width:3.5em}
.tgroup{display:flex;align-items:center;gap:4px;direction:ltr}
.tgroup .time{font-size:18px;min-width:6ch;text-align:center}
.trow .nudge{padding:6px 8px}
.mark{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.listen{display:flex;gap:10px;flex-wrap:wrap}
.listen .btn{flex:1 1 150px}
.ttime{display:flex;flex-direction:column;gap:6px}
.tinrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tin{display:flex;align-items:center;gap:4px}
.tin input{font-family:var(--mono);font-size:20px;width:4.2ch;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.tin input#ts{width:5ch}
.tin input:focus{outline:2px solid var(--accent);outline-offset:1px}
.lenbox{display:flex;flex-direction:column;gap:8px}
.lenhead{display:flex;justify-content:space-between;align-items:baseline}
.lenhead b{font-size:18px}
#lenR{width:100%;accent-color:var(--accent)}
.range{margin:0;font-size:16px}
.range b{font-size:18px}
.fine{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fine summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.fine[open]{display:flex;flex-direction:column;gap:10px}
.fine[open] summary{margin-bottom:2px}
.tfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tinfo{font-size:14px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.chip .num{font-size:12px;color:var(--muted)}
.chip.sel-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel-on .num{color:var(--accent-ink)}

.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .row{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;align-items:center;gap:8px;padding-top:16px;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}

.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,label.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.export{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;position:sticky;bottom:0;z-index:5;background:var(--paper);margin-inline:-14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.export .btn{flex:1 1 auto}
.export .status{flex:1 1 100%;margin:0}
.a2hs{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px}
.a2hs p{margin:0;flex:1;font-size:14px;line-height:1.45}
.a2hs-icon{color:var(--accent);flex:none;display:grid}
.a2hs-x{flex:none;font:inherit;font-size:16px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.sitefoot{text-align:center;font-size:13px;color:var(--muted);padding-block:8px 24px}
.sitefoot a{color:var(--muted)}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
main:focus{outline:none}
.hbtns{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.hrow{flex-wrap:wrap}
#a11yBtn{display:flex;align-items:center;gap:6px}
.wavebox:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a:focus-visible,.chip:focus-visible,.nudge:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.a11y{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.a11y-head{display:flex;justify-content:space-between;align-items:center}
.a11y-head h2{font-family:var(--body);font-size:17px;margin:0}
.a11y-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.a11y-opt{font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.a11y-opt b{font-size:18px}
.a11y-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.a11y a{color:var(--accent);font-size:14px}
/* accessibility modes */
html.a-bigger{font-size:125%}
html.a-bigger body{font-size:18.75px}
html:root.a-contrast:not([data-none]){--bg:#000;--paper:#000;--ink:#fff;--muted:#e6e6e6;--line:#fff;--well:#111;--accent:#ffd400;--accent-ink:#000;--accent-soft:rgba(255,212,0,.22);--wave:#9a9a9a;color-scheme:dark}
html.a-links a{text-decoration:underline!important;text-underline-offset:3px;font-weight:700}
html.a-still *,html.a-still *::before,html.a-still *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.a-readable body,html.a-readable input,html.a-readable button,html.a-readable select{font-family:Arial,"Arial Hebrew",Helvetica,sans-serif!important;letter-spacing:.02em;word-spacing:.08em}
html.a-readable h1,html.a-readable .sname{font-family:Arial,"Arial Hebrew",Helvetica,sans-serif!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.invite{flex:1 1 100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px}
.invite p{margin:0;flex:1 1 200px;font-size:14px}
.invite .btn{flex:0 0 auto}
.steps{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 2px;position:relative}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:14px}
.steps li+li::after{content:"";position:absolute;top:17px;inset-inline-end:calc(50% + 24px);width:calc(100% - 38px);height:1px;background:var(--line)}
.steps b{font-size:13.5px;line-height:1.3}
.steps span{display:none}
.a2hs{border-radius:16px}
.btn.big{font-size:17px;padding:14px 24px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 0}
.adv .controls{margin-top:12px}
.status{font-size:13.5px;color:var(--muted);margin:0;flex:1 1 220px;min-width:0}

.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.guide section{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.guide h3{margin:0 0 8px;font-size:16px}
.guide ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted);margin:0}
.mine{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px}
.minehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.minehead h2{margin:0;font-size:18px}
.mine ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mine li{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mine .stop{display:flex;align-items:flex-start;gap:8px}
.mine .srow{display:flex;flex-wrap:wrap;gap:6px}
.mine .srow.extra{padding:8px;border-radius:12px;background:var(--bg)}
.mine .star{font-size:18px;line-height:1;padding:6px 9px;color:var(--muted)}
.mine li.fav .star{color:#E8A400;border-color:#E8A400}
.mine .more{font-weight:800;min-width:40px;justify-content:center}
.mine .ren{font:inherit;font-size:16px;font-weight:600;width:100%;padding:6px 10px;border-radius:10px;border:1px solid var(--accent);background:var(--bg);color:var(--ink)}
.mine li:first-child{border-top:0}
.mine .mname{flex:1 1 140px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mine .mname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mine .mb{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.mine .mb.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mine .mb.del{color:var(--muted)}
/* "what now" card shown right after a ringtone is created */
.next{display:flex;gap:16px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px}
.next h3{margin:0 0 6px;font-size:16px}
.next ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.next .txt{flex:1 1 auto;min-width:0}
.sheet{flex:none;width:118px;border-radius:14px 14px 6px 6px;background:var(--paper);border:1px solid var(--line);padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px;position:relative}
.sheet .icons{display:flex;gap:5px;justify-content:center;margin-bottom:2px}

<script>
(() => {
const $=id=>document.getElementById(id);
/* device: auto-detected, but the person can switch it (e.g. making a ringtone on a laptop for an Android phone) */
let ANDROID=/Android/i.test(navigator.userAgent);
try{const d=localStorage.getItem('snipring-device');if(d==='android'||d==='iphone')ANDROID=d==='android'}catch(e){}
document.documentElement.classList.toggle('android',ANDROID);
let ctx=null, song=null, peaks=null, energy=null, FR=10; // energy frames per second
const S={cursor:0,start:0,len:29,fin:.5,fout:2,norm:true,cand:0,mode:'ring',gain:0,speed:1,loop:1,voice:'none',vo:null};
/* what we're making: ringtone, text tone, or alarm — each with its own lengths and fades */
const MODES={ring:{lens:[10,15,20,25,29.5],def:29,min:3,max:29.5,step:.5,fin:.5,fout:2},
  text:{lens:[1,2,3,5,8],def:3,min:.5,max:10,step:.1,fin:.02,fout:.4},
  alarm:{lens:[15,20,25,29.5],def:29.5,min:3,max:29.5,step:.5,fin:3,fout:2}};
const ALARM_A={lens:[15,30,45,60],def:45,min:3,max:60,step:1,fin:3,fout:2};
const M=()=>ANDROID&&S.mode==='alarm'?ALARM_A:MODES[S.mode];
let Z=1,V0=0; // waveform zoom: Z× magnification, view starts at V0 seconds
let cands=[];

function ensureCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
const fmtShort=t=>{const m=Math.floor(t/60),s=Math.floor(t-m*60);return m+':'+(s<10?'0':'')+s};
function say(t){$('status').textContent=t}
/* analytics: anonymous funnel events, no cookies; no-op until the Umami script is present */
function track(name,data){try{window.umami&&window.umami.track(name,data)}catch(e){}}

/* ---------- demo song (synthetic, so the page works before a file is chosen) ---------- */
function demoSong(){
  const sr=44100,dur=72,n=sr*dur,L=new Float32Array(n),R=new Float32Array(n);
  const beat=.5; // 120 BPM
  const add=(t,f,amp,dec,pan=0)=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*dec*5));
    for(let i=0;i<len;i++){const x=i/sr,v=amp*Math.sin(2*Math.PI*f*x)*Math.exp(-x/dec)*Math.min(1,x/.004);L[s0+i]+=v*(1-pan);R[s0+i]+=v*(1+pan)}};
  const kick=t=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*.25));let ph=0;
    for(let i=0;i<len;i++){const x=i/sr;ph+=2*Math.PI*(50+90*Math.exp(-x/.03))/sr;const v=.55*Math.sin(ph)*Math.exp(-x/.08);L[s0+i]+=v;R[s0+i]+=v}};
  const hat=t=>{const s0=Math.floor(t*sr),len=Math.min(n-s0,Math.floor(sr*.05));for(let i=0;i<len;i++){const v=.12*(Math.random()*2-1)*Math.exp(-i/sr/.012);L[s0+i]+=v*.7;R[s0+i]+=v*1.3}};
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const prog=[57,53,48,55]; // A F C G
  const mel=[76,0,81,0,79,76,74,0, 76,0,72,74,76,0,0,0, 76,0,81,0,79,76,74,0, 79,76,74,72,69,0,0,0];
  const sections=[[0,8,'intro'],[8,28,'verse'],[28,44,'chorus'],[44,56,'verse'],[56,72,'chorus']];
  for(const [a,b,kind] of sections){
    for(let t=a;t<b;t+=beat/2){
      const step=Math.round((t-a)/(beat/2)),bar=Math.floor(t/2)%4,root=prog[bar];
      if(step%8===0)[0,4,7].forEach((iv,k)=>add(t,hz(root+12+iv),kind==='intro'?.05:.07,1.2,k-1));
      if(kind!=='intro'&&step%4===0)add(t,hz(root-12),kind==='chorus'?.32:.22,.35);
      if(kind==='verse'&&step%2===1)add(t,hz(root+24+[0,7,12][step%3]),.06,.2,.5);
      if(kind==='chorus'){const m=mel[step%32];if(m)add(t,hz(m),.24,.45,-.2);if(step%4===0)kick(t);if(step%2===1)hat(t);}
    }
  }
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));
  for(let i=0;i<n;i++){L[i]*=.9/pk;R[i]*=.9/pk}
  return {sampleRate:sr,length:n,duration:dur,numberOfChannels:2,getChannelData:c=>c?R:L};
}

/* ---------- analysis ---------- */
function analyse(){
  const ch=song.numberOfChannels,n=song.length,sr=song.sampleRate;
  const a=song.getChannelData(0),b=ch>1?song.getChannelData(1):a;
  const P=4000;peaks=new Float32Array(P);Z=1;V0=0;$('zLbl').textContent='1×';$('zOut').disabled=true;$('zIn').disabled=song.duration<6;
  const bs=Math.max(1,Math.floor(n/P));
  for(let p=0;p<P;p++){let m=0;const e=Math.min(n,(p+1)*bs);for(let i=p*bs;i<e;i+=4){const v=Math.abs(a[i])+Math.abs(b[i]);if(v>m)m=v}peaks[p]=m/2}
  const hop=Math.floor(sr/FR),F=Math.floor(n/hop);energy=new Float32Array(F);
  for(let f=0;f<F;f++){let s=0;const o=f*hop;for(let i=0;i<hop;i+=2){const v=(a[o+i]+b[o+i])/2;s+=v*v}energy[f]=Math.sqrt(s/(hop/2))}
  findCandidates();
}
/* iPhone needs every ringtone/alarm sound under 30 s; Android alarms may run longer */
const CAP=()=>ANDROID&&S.mode==='alarm'?60:29.5;
/* Chorus finder: chroma self-similarity + loudness.
   A chorus is the loud part of a song that repeats, so we look for the window
   whose harmony recurs elsewhere in the song most strongly. */
function fftMag(re, im) { // in-place radix-2, returns nothing
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

function songFeatures(song, hopSec) {
  const sr0 = song.sampleRate, a = song.getChannelData(0), b = song.numberOfChannels > 1 ? song.getChannelData(1) : a;
  const dec = Math.max(1, Math.round(sr0 / 11025)), sr = sr0 / dec;
  const n = Math.floor(song.length / dec), x = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; const o = i * dec; for (let k = 0; k < dec; k++) s += a[o + k] + b[o + k]; x[i] = s / (2 * dec); }
  const N = 4096, hop = Math.round(sr * hopSec), F = Math.max(1, Math.floor((n - N) / hop) + 1);
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const pc = new Int8Array(N / 2).fill(-1);
  for (let k = 1; k < N / 2; k++) { const f = k * sr / N; if (f >= 80 && f <= 4000) pc[k] = ((Math.round(12 * Math.log2(f / 440)) + 69) % 12 + 12) % 12; }
  const chroma = new Float32Array(F * 12), rms = new Float32Array(F), re = new Float32Array(N), im = new Float32Array(N);
  for (let f = 0; f < F; f++) {
    const o = f * hop; let e = 0;
    for (let i = 0; i < N; i++) { const v = x[o + i] || 0; e += v * v; re[i] = v * win[i]; im[i] = 0; }
    rms[f] = Math.sqrt(e / N);
    fftMag(re, im);
    const c = chroma.subarray(f * 12, f * 12 + 12);
    for (let k = 1; k < N / 2; k++) if (pc[k] >= 0) c[pc[k]] += Math.hypot(re[k], im[k]);
    let mx = 0; for (let i = 0; i < 12; i++) { c[i] = Math.sqrt(c[i]); mx += c[i] / 12; }
    for (let i = 0; i < 12; i++) c[i] -= mx;              // centre: keep only which notes stand out
    let nn = 0; for (let i = 0; i < 12; i++) nn += c[i] * c[i]; nn = Math.sqrt(nn) || 1;
    for (let i = 0; i < 12; i++) c[i] /= nn;
  }
  return { chroma, rms, F, hopSec };
}

/* returns up to 3 candidate starts (seconds), best first */
function chorusCandidates(song, winSec) {
  const hopSec = 0.5, { chroma, rms, F } = songFeatures(song, hopSec);
  const W = Math.max(4, Math.min(F - 1, Math.round(winSec / hopSec)));
  if (F < W * 2 + 2) return [{ t: 0, score: 0 }];
  // similarity matrix (cosine of unit chroma vectors), contrast-stretched
  const S = new Float32Array(F * F);
  for (let i = 0; i < F; i++) for (let j = i; j < F; j++) {
    let d = 0; for (let k = 0; k < 12; k++) d += chroma[i * 12 + k] * chroma[j * 12 + k];
    d = Math.max(0, d); S[i * F + j] = S[j * F + i] = d;
  }
  // loudness, normalised 0..1
  let rmax = 0; for (let i = 0; i < F; i++) rmax = Math.max(rmax, rms[i]);
  const loud = new Float32Array(F + 1); for (let i = 0; i < F; i++) loud[i + 1] = loud[i] + rms[i] / (rmax || 1);
  const minLag = Math.round(W * 0.8), score = new Float32Array(F - W + 1);
  const sims = new Float32Array(F);
  for (let i = 0; i + W <= F; i++) {
    sims.fill(-1);
    for (let j = 0; j + W <= F; j++) {
      if (Math.abs(i - j) < minLag) continue;
      let v = 0; for (let k = 0; k < W; k++) v += S[(i + k) * F + j + k];
      sims[j] = v / W;
    }
    // the two strongest repeats at clearly different places (a chorus comes back 2-3 times)
    let j1 = -1; for (let j = 0; j < F; j++) if (sims[j] > (j1 < 0 ? -1 : sims[j1])) j1 = j;
    let j2 = -1; for (let j = 0; j < F; j++) if (Math.abs(j - j1) >= minLag && sims[j] > (j2 < 0 ? -1 : sims[j2])) j2 = j;
    const best = Math.max(0, j1 < 0 ? 0 : sims[j1]), second = Math.max(0, j2 < 0 ? 0 : sims[j2]);
    const L = (loud[i + W] - loud[i]) / W;
    score[i] = (best + second) * (0.6 + 0.4 * L);
  }
  const order = [...score.keys()].sort((p, q) => score[q] - score[p]), picked = [];
  for (const i of order) { if (picked.length >= 3) break; if (picked.every(p => Math.abs(p - i) >= W * 0.75)) picked.push(i); }
  return picked.map(i => {
    // snap to the strongest loudness rise within ±3 s (section boundary)
    let bi = i, bd = -1;
    for (let k = Math.max(2, i - 6); k <= Math.min(F - W, i + 6); k++) { const d = (rms[k] + (rms[k + 1] || 0)) - (rms[k - 1] + rms[k - 2]); if (d > bd) { bd = d; bi = k; } }
    return { t: bi * hopSec, score: score[i] };
  });
}

function energyCandidates(){
  const F=energy.length,W=Math.min(F,Math.round(Math.min(M().def,song.duration)*FR));
  const pre=new Float64Array(F+1);for(let i=0;i<F;i++)pre[i+1]=pre[i]+energy[i];
  const mean=(s,w)=>(pre[Math.min(F,s+w)]-pre[Math.max(0,s)])/Math.max(1,Math.min(F,s+w)-Math.max(0,s));
  const scores=[];for(let s=0;s+W<=F;s+=5)scores.push([mean(s,W),s]);
  scores.sort((x,y)=>y[0]-x[0]);
  const picked=[];
  for(const [sc,s] of scores){if(picked.length>=3)break;if(picked.every(p=>Math.abs(p.s-s)>=W*.6))picked.push({sc,s})}
  cands=picked.map(p=>{let best=p.s,bd=-1;
    for(let s=Math.max(0,p.s-50);s<=Math.min(F-W,p.s+50);s++){const d=mean(s,10)-mean(s-10,10);if(d>bd){bd=d;best=s}}
    return {t:best/FR,score:p.sc}});
  return cands;
}
/* "Find the best part": three different, real measurements of the song (no AI, nothing simulated)
   chorus = the window whose harmony repeats most (chroma self-similarity)
   drop   = the biggest sudden rise in loudness
   peak   = the loudest stretch of the song */
function findCandidates(){
  const D=song.duration,L=Math.min(M().def,CAP()),out=[],far=t=>out.every(c=>Math.abs(c.t-t)>=Math.min(8,L*.5));
  if(D<Math.max(6,L*.6)){cands=[{t:0,kind:'start'}];renderCands();pickCand(0);return}
  let ch=[];try{ch=chorusCandidates(song,15)}catch(e){}
  if(ch.length&&ch[0].score)out.push({t:ch[0].t,kind:'chorus'});
  const F=energy.length,pre=new Float64Array(F+1);for(let i=0;i<F;i++)pre[i+1]=pre[i]+energy[i];
  const mean=(s0,w)=>{const a=Math.max(0,s0),b=Math.min(F,s0+w);return b>a?(pre[b]-pre[a])/(b-a):0};
  // drop: after/before loudness ratio over 4 s, at least 6 s into the song
  const H=4*FR,drops=[];for(let f=Math.max(H,6*FR);f+H<F;f+=2){const bef=mean(f-H,H),aft=mean(f,H);if(aft>.05)drops.push([aft/(bef+.02),f])}
  drops.sort((x,y)=>y[0]-x[0]);for(const [r,f] of drops){if(r<1.35)break;const t=f/FR;if(far(t)){out.push({t,kind:'drop'});break}}
  // peak: loudest window of the ringtone length
  const W=Math.min(F,Math.round(L*FR)),pk=[];for(let s0=0;s0+W<=F;s0+=5)pk.push([mean(s0,W),s0]);
  pk.sort((x,y)=>y[0]-x[0]);for(const [,s0] of pk){const t=s0/FR;if(far(t)){out.push({t,kind:'peak'});break}}
  if(!out.length)out.push({t:0,kind:'start'});
  cands=out;renderCands();pickCand(0);
}
function candLen(c){return Math.min(Math.min(M().def,CAP()),song.duration-c.t)}
function pickCand(i){S.cand=i;const t=cands[i].t,room=song.duration-t,L=Math.min(M().def,CAP());
  if(room>=Math.min(L,12))setRange(t,t+Math.min(L,room),'start');else setRange(t,t+L,'move');markCand()}
const KIND={chorus:['🎤','kChorus','kChorusD'],drop:['💥','kDrop','kDropD'],peak:['🔥','kPeak','kPeakD'],start:['▶️','kStart','kStartD']};
function renderCands(){
  const box=$('cands');box.innerHTML='';
  cands.forEach((c,i)=>{const [ic,lk,dk]=KIND[c.kind]||KIND.start,card=document.createElement('div');card.className='best';
    card.innerHTML='<div class="bh"><span class="bi" aria-hidden="true">'+ic+'</span><b>'+t(lk)+'</b></div><p class="bd">'+t(dk)+'</p>'
      +'<p class="bt num" dir="ltr">'+fmtShort(c.t)+' · '+candLen(c).toFixed(0)+t('secShort')+'</p>'
      +'<div class="bb"><button type="button" class="mb bplay">'+t('bListen')+'</button><button type="button" class="mb pri buse">'+t('bUse')+'</button></div>';
    card.querySelector('.bplay').setAttribute('aria-label',t('bListen')+': '+t(lk));card.querySelector('.buse').setAttribute('aria-label',t('bUse')+': '+t(lk));
    card.querySelector('.bplay').addEventListener('click',()=>{const on=playing&&mode==='cand'&&candPlaying===i;stopPreview();if(on)return;
      mode='cand';candPlaying=i;startPlayback(c.t,candLen(c),true);mode='cand';track('best_listen',{kind:c.kind})});
    card.querySelector('.buse').addEventListener('click',()=>{pickCand(i);invalidate();previewSel();track('best_use',{kind:c.kind})});
    box.appendChild(card)});
}
let candPlaying=-1;
function markCand(){[...$('cands').children].forEach((b,i)=>{b.classList.toggle('sel-on',i===S.cand);const u=b.querySelector('.buse');if(u){u.setAttribute('aria-pressed',String(i===S.cand));u.textContent=i===S.cand?t('bUsing'):t('bUse')}})}

/* selection: start + len, both handles free, length capped below 30 s */
function setRange(a,b,mode){
  const D=song.duration,r=v=>Math.round(v*10)/10;
  if(mode==='move'){const len=Math.min(b-a,CAP(),D);a=Math.max(0,Math.min(D-len,a));b=a+len}
  a=Math.max(0,Math.min(D,a));b=Math.max(0,Math.min(D,b));
  const MX=Math.min(CAP(),M().max),MN=Math.min(M().min,D);
  if(mode==='move'&&b-a>MX)b=a+MX;
  if(mode==='start'){ if(b-a>MX)b=Math.min(D,a+MX); if(b-a<MN){b=Math.min(D,a+MN);a=Math.max(0,b-MN)} }
  else if(mode==='end'){ if(b-a>MX)a=Math.max(0,b-MX); if(b-a<MN){a=Math.max(0,b-MN);b=Math.min(D,a+MN)} }
  S.start=r(a);S.len=Math.max(0,r(b)-r(a));
  $('tStart').textContent=fmt(S.start);$('sumA').textContent=fmtShort(S.start);$('sumB').textContent=fmtShort(S.start+S.len);syncTime();$('tEnd').textContent=fmt(S.start+S.len);syncAria();$('lenR').value=S.len;[...$('lens').children].forEach(b=>b.classList.toggle('sel-on',Math.abs(+b.dataset.len-S.len)<.05));
  refreshOut();follow();draw();
}
function syncTime(){const a=document.activeElement;if(a&&(a.id==='tm'||a.id==='ts'))return;
  const m=Math.floor(S.start/60),sec=Math.round((S.start-m*60)*10)/10;$('tm').value=m;$('ts').value=sec<10?'0'+sec:sec}
function syncAria(){const w=$('wavebox');if(!song)return;
  w.setAttribute('aria-valuemax',String(Math.floor(song.duration)));w.setAttribute('aria-valuenow',String(Math.round(S.start)));
  w.setAttribute('aria-valuetext',t('waveVal').replace('{a}',fmt(S.start)).replace('{b}',fmt(S.start+S.len)));
  [...$('lens').children].forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('sel-on'))))}
function setStart(t){setRange(t,t+S.len,'move')}

/* ---------- waveform ---------- */
const cv=$('wave');
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(playT){
  if(!peaks)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const D=song.duration,VD=D/Z,X=t=>(t-V0)/VD*w,x0=X(S.start),x1=X(S.start+S.len),acc=css('--accent'),wave=css('--wave'),ink=css('--ink');
  const rr=(x,y,ww,hh,r)=>{g.beginPath();g.roundRect?g.roundRect(x,y,ww,hh,r):g.rect(x,y,ww,hh)};
  // selected window: soft fill and a glowing outline
  g.fillStyle=css('--accent-soft');rr(x0,6,x1-x0,h-12,12);g.fill();
  g.save();g.shadowColor=acc;g.shadowBlur=14;g.strokeStyle=acc;g.lineWidth=2;rr(x0+1,7,x1-x0-2,h-14,12);g.stroke();g.restore();
  // rounded bars; inside the window they light up, and fill in as the ringtone plays
  const ph=playT!=null?X(playT):-1,step=5,bw=3,mid=h/2;
  for(let x=2;x<w-1;x+=step){const tt=V0+x/w*VD,i0=Math.floor(tt/D*peaks.length),i1=Math.max(i0+1,Math.floor((tt+step/w*VD)/D*peaks.length));
    let p=0;for(let i=i0;i<i1&&i<peaks.length;i++)if(peaks[i]>p)p=peaks[i];const bh=Math.max(3,p*(h-34));
    const inside=x>=x0&&x<=x1;
    g.globalAlpha=inside?(ph>=0&&x>ph?.55:1):.55;g.fillStyle=inside?acc:wave;rr(x,mid-bh/2,bw,bh,1.5);g.fill()}
  g.globalAlpha=1;
  // handles: pills on the window edges
  for(const x of [x0,x1]){g.fillStyle=acc;rr(x-6,mid-22,12,44,6);g.fill();
    g.fillStyle=css('--accent-ink');g.fillRect(x-2,mid-9,1.5,18);g.fillRect(x+0.5,mid-9,1.5,18)}
  const ct=playT!=null?playT:S.cursor;
  if(ct!=null){const px=X(ct);g.fillStyle=ink;g.fillRect(px-1,4,2,h-8);g.beginPath();g.arc(px,6,4.5,0,7);g.fill()}
}
function ruler(){const D=song.duration,VD=D/Z,r=$('ruler');r.innerHTML='';for(let i=0;i<=4;i++){const s=document.createElement('span');s.textContent=Z>1&&VD<20?fmt(V0+VD*i/4):fmtShort(V0+VD*i/4);r.appendChild(s)}}

/* ---------- load a file ---------- */
async function loadFile(f){
  if(!f)return;stopPreview();
  const isVideo=/^video\//.test(f.type)||/\.(mp4|mov|m4v)$/i.test(f.name);
  if(f.size>400*1024*1024){say(t('sTooBig'));track('song_open_failed',{ext:'too_big'});return}
  say(t('sOpening')+f.name+'…');
  try{
    const ab=await f.arrayBuffer();const c=ensureCtx();
    song=await new Promise((res,rej)=>{const p=c.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
    let fname=f.name;try{fname=decodeURIComponent(fname)}catch(e){}
    const nm=fname.replace(/\.[^.]+$/,'');await useSong(song,nm,isVideo?'video':'file',fname);
  }catch(e){say(isVideo?t('sVideoFail'):t('sOpenFail'));track('song_open_failed',{ext:(f.name.split('.').pop()||'').toLowerCase()})}
}

/* Capture raw PCM straight from the mic. No MediaRecorder and no decoding step:

  catch(e){$('recSt').textContent=t('recDenied');track('rec_failed',{why:(e&&e.name)||'error'});return}

/* selection → speed → repeat → volume → fades, capped under 30 s. Used for both preview and export. */
const VSPEED={chip:1.45};
function effSpeed(){return S.speed*(VSPEED[S.voice]||1)}
/* selection → speed → reverse/repeat → volume → fades → voice effect → dedication → soft clip.
   One pipeline for both preview and export, capped under 30 s. */
function processClip(){
  const sr=song.sampleRate,a=Math.floor(S.start*sr),n0=Math.max(1,Math.min(song.length-a,Math.floor(S.len*sr)));
  const sp=effSpeed(),seg=Math.max(1,Math.floor(n0/sp)),n=Math.min(Math.floor(CAP()*sr),seg*S.loop),rev=S.voice==='rev';
  const k=selGain()*Math.pow(10,S.gain/20),fi=Math.floor(Math.min(S.fin,n/sr/2)*sr),fo=Math.floor(Math.min(S.fout,n/sr/2)*sr),xf=Math.floor(.012*sr),chans=[];
  for(let c=0;c<2;c++){const src=song.getChannelData(Math.min(c,song.numberOfChannels-1)),out=new Float32Array(n);
    for(let i=0;i<n;i++){const j=i%seg,jj=rev?seg-1-j:j,p=a+jj*sp,i0=Math.floor(p),f=p-i0,s1=src[Math.min(i0+1,song.length-1)];

      if(S.loop>1){if(j<xf&&i>=seg)env*=j/xf;if(seg-j<xf&&i+xf<n)env*=(seg-j)/xf}
      if(i<fi)env*=i/fi;if(i>n-fo)env*=(n-i)/fo;
      out[i]=v*env}
    voiceFx(out,sr);chans.push(out)}
  mixDedication(chans,sr,n);
  const soft=v=>{const x=Math.abs(v);return x<=.8?v:Math.sign(v)*(.8+.2*Math.tanh((x-.8)/.2))};
  for(const ch of chans)for(let i=0;i<n;i++)ch[i]=soft(ch[i]);
  return {sr,n,chans,seg};
}
function voiceFx(x,sr){const v=S.voice,n=x.length;
  if(v==='robot'){for(let i=0;i<n;i++)x[i]*=1.5*Math.sin(2*Math.PI*62*i/sr)}
  else if(v==='echo'){const d=Math.floor(.23*sr);for(let i=d;i<n;i++)x[i]+=.48*x[i-d];for(let i=0;i<n;i++)x[i]*=.72}

function mixDedication(chans,sr,n){const vo=S.vo;if(!vo)return;

function toMp3(clip){

    document.querySelectorAll('.a11y-opt[data-a]').forEach(b=>b.setAttribute('aria-pressed',String(!!on[b.dataset.a])));

  const open=v=>{$('a11yPanel').hidden=!v;$('a11yBtn').setAttribute('aria-expanded',String(v));if(v)$('a11yClose').focus();else $('a11yBtn').focus()};

/* incoming call preview: plays the finished ringtone on a full-screen call screen */
let callSrc=null,callPrev=null;
function callInit(){const v=$('callName').value.trim();$('callInit').textContent=v?[...v][0].toUpperCase():'🙂';
  let h=0;for(const ch of v)h=(h*31+ch.codePointAt(0))%360;const o=$('callOv').style;o.setProperty('--cA','hsl('+h+' 55% 45%)');o.setProperty('--cB','hsl('+((h+60)%360)+' 45% 35%)')}
/* drag to answer: the iPhone-style knob slides sideways, the Android-style button swipes up; a tap also works */
function dragAnswer(el,axis,limit){let d=null;
  el.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY,moved:0};el.setPointerCapture(e.pointerId);el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!d)return;const v=axis==='x'?Math.max(0,e.clientX-d.x):Math.max(0,d.y-e.clientY);d.moved=v;
    el.style.transform=axis==='x'?'translateX('+Math.min(v,limit())+'px)':'translateY('+(-Math.min(v,limit()))+'px)'});
  const end=()=>{if(!d)return;const done=d.moved>=limit()*.8||d.moved<6;d=null;el.style.transition='transform .25s';el.style.transform='';if(done)closeCall('accept')};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{d=null;el.style.transform=''});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeCall('accept')}})}
dragAnswer($('cKnob'),'x',()=>$('cSlide').clientWidth-72);
dragAnswer($('cPill'),'y',()=>120);

function openCall(){if(!song)return;stopPreview();callPrev=document.activeElement;
  let nm='';try{nm=localStorage.getItem('snipring-callname')||''}catch(e){}$('callName').value=nm||t('callDefault');callInit();
  $('callTune').textContent=$('name').value.trim()||t('sample');
  const ov=$('callOv');ov.classList.toggle('ios',!ANDROID);ov.classList.toggle('and',ANDROID);
  $('callOv').hidden=false;document.body.style.overflow='hidden';document.querySelector('.wrap').setAttribute('aria-hidden','true');
  try{const c=ensureCtx(),clip=processClip(),b=c.createBuffer(2,clip.n,clip.sr);b.copyToChannel(clip.chans[0],0);b.copyToChannel(clip.chans[1],1);
    callSrc=c.createBufferSource();callSrc.buffer=b;callSrc.loop=true;callSrc.connect(c.destination);callSrc.start()}catch(e){}
  (ANDROID?$('cPill'):$('cKnob')).focus();track('call_preview',{mode:S.mode,style:ANDROID?'android':'iphone'})}
function closeCall(how){if($('callOv').hidden)return;try{callSrc&&callSrc.stop()}catch(e){}callSrc=null;$('callOv').hidden=true;document.body.style.overflow='';document.querySelector('.wrap').removeAttribute('aria-hidden');
  try{localStorage.setItem('snipring-callname',$('callName').value.trim())}catch(e){}callPrev&&callPrev.focus&&callPrev.focus();track('call_closed',{how})}

/* ---------- my ringtones: kept in IndexedDB on this device only ---------- */
let mine=[],mineAudio=null,mineUrl=null,minePlaying=null;
function db(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('snipring',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('rings',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbDo(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('rings',mode),st=tx.objectStore('rings'),out=fn(st);
  tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)})}
/* records: {id(created ms), name, secs, data(ArrayBuffer mp3), type:'ring'|'text'|'alarm', fav:bool}
   older records without type/fav are read as a ringtone, not favourite */
const sortMine=()=>mine.sort((a,b)=>(!!b.fav-!!a.fav)||(b.id-a.id));
async function loadMine(){try{const all=await dbDo('readonly',st=>st.getAll());mine=all||[];sortMine()}catch(e){mine=[]}renderMine()}
const putRec=r=>dbDo('readwrite',st=>st.put(r));
async function prune(){const extra=mine.filter(r=>!r.fav).sort((a,b)=>a.id-b.id);while(mine.length>30&&extra.length){const old=extra.shift();mine=mine.filter(x=>x!==old);try{await dbDo('readwrite',st=>st.delete(old.id))}catch(e){}}}
async function saveMine(file,secs){
  try{// stored as a plain ArrayBuffer: Safari has been unreliable with Blobs inside IndexedDB
    const data=await file.arrayBuffer();
    const rec={id:Date.now(),name:file.name.replace(/\.mp3$/i,''),secs:Math.round(secs*10)/10,data,type:S.mode,fav:false};
    const last=[...mine].sort((a,b)=>b.id-a.id)[0];
    if(last&&last.name===rec.name&&last.data.byteLength===data.byteLength){say($('status').textContent+' '+t('mineSaved'));return}
    await putRec(rec);mine.push(rec);await prune();sortMine();
    renderMine();say($('status').textContent+' '+t('mineSaved'));
  }catch(e){track('mine_save_failed',{err:String(e&&e.name||e)})}
}
const mineBlob=r=>r.blob||new Blob([r.data],{type:'audio/mpeg'});
function mineFile(r){return new File([mineBlob(r)],r.name+'.mp3',{type:'audio/mpeg'})}
function stopMine(){if(mineAudio){mineAudio.pause();mineAudio=null}if(mineUrl){URL.revokeObjectURL(mineUrl);mineUrl=null}minePlaying=null}
let mineOpen=null,mineRen=null;
const TYPE_IC={ring:'🔔',text:'💬',alarm:'⏰'},TYPE_K={ring:'mRing',text:'mText',alarm:'mAlarm'};
/* "edit again": decode the saved MP3 and open it in the editor like any other song */
async function editAgain(r){stopMine();try{const c=ensureCtx(),buf=await new Promise((res,rej)=>{const p=c.decodeAudioData(r.data.slice(0),res,rej);if(p&&p.then)p.then(res,rej)});
  if(r.type&&r.type!==S.mode)setMode(r.type,false);await useSong(buf,r.name,'mine',t('mineBadge'));track('mine_edit')}catch(e){say(t('sOpenFail'))}}
function renderMine(){
  const ul=$('mineList');ul.textContent='';$('mine').hidden=false;$('mineEmpty').hidden=!!mine.length;
  const btn=(txt,cls,fn,aria)=>{const b=document.createElement('button');b.type='button';b.className='mb'+(cls?' '+cls:'');b.textContent=txt;if(aria)b.setAttribute('aria-label',aria);b.addEventListener('click',fn);return b};
  mine.forEach(r=>{
    const type=r.type||'ring',li=document.createElement('li');li.className='snip'+(r.fav?' fav':'');
    const top=document.createElement('div');top.className='stop';
    const star=btn(r.fav?'★':'☆','star',async()=>{r.fav=!r.fav;try{await putRec(r)}catch(e){}sortMine();renderMine();track('mine_fav',{on:r.fav})},(r.fav?t('mineUnfav'):t('mineFav'))+': '+r.name);
    star.setAttribute('aria-pressed',String(!!r.fav));top.appendChild(star);
    const nm=document.createElement('span');nm.className='mname';
    if(mineRen===r.id){const inp=document.createElement('input');inp.className='ren';inp.value=r.name;inp.maxLength=40;inp.setAttribute('aria-label',t('mineRename'));
      const done=async ok=>{if(mineRen!==r.id)return;mineRen=null;const v=inp.value.trim().replace(/[\\/:*?"<>|%]/g,'');if(ok&&v&&v!==r.name){r.name=v;try{await putRec(r)}catch(e){}track('mine_renamed')}renderMine()};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(true)}else if(e.key==='Escape')done(false)});inp.addEventListener('blur',()=>done(true));
      nm.appendChild(inp);setTimeout(()=>{inp.focus();inp.select()},0)}
    else{nm.textContent=r.name}
    const sm=document.createElement('small');sm.textContent=TYPE_IC[type]+' '+t(TYPE_K[type])+' · '+r.secs.toFixed(1)+' '+t('sec')+' · '+new Date(r.id).toLocaleDateString(lang==='he'?'he-IL':'en-US');nm.appendChild(sm);top.appendChild(nm);li.appendChild(top);
    const row=document.createElement('div');row.className='srow';
    const playing=minePlaying===r.id;
    row.appendChild(btn(playing?t('mineStop'):t('minePlay'),'',()=>{
      const was=minePlaying===r.id;stopMine();stopPreview();
      if(!was){mineUrl=URL.createObjectURL(mineBlob(r));mineAudio=new Audio(mineUrl);minePlaying=r.id;mineAudio.onended=()=>{stopMine();renderMine()};mineAudio.play().catch(()=>{});track('mine_played')}
      renderMine()},(playing?t('mineStop'):t('minePlay'))+': '+r.name));
    if(navigator.share&&!ANDROID)row.appendChild(btn(t('mineSet'),'pri',async()=>{track('mine_set_tapped');try{await navigator.share({files:[mineFile(r)]});track('share_completed',{from:'mine'})}catch(e){}},t('setRt')+': '+r.name));
    row.appendChild(btn(t('mineDl'),ANDROID||!navigator.share?'pri':'',()=>{const u=URL.createObjectURL(mineBlob(r)),a=document.createElement('a');a.href=u;a.download=r.name+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);track('mp3_downloaded',{from:'mine'})},t('mineDl')+': '+r.name));
    const more=btn('⋯','more',()=>{mineOpen=mineOpen===r.id?null:r.id;renderMine()},t('mineMore')+': '+r.name);more.setAttribute('aria-expanded',String(mineOpen===r.id));row.appendChild(more);
    li.appendChild(row);
    if(mineOpen===r.id){const x=document.createElement('div');x.className='srow extra';
      x.appendChild(btn('✏️ '+t('mineRename'),'',()=>{mineRen=r.id;mineOpen=null;renderMine()}));
      x.appendChild(btn('🎚️ '+t('mineEdit'),'',()=>editAgain(r)));
      x.appendChild(btn('⧉ '+t('mineDup'),'',async()=>{const c={...r,id:Date.now(),name:(r.name+' '+t('mineCopy')).slice(0,40),fav:false};try{await putRec(c)}catch(e){}mine.push(c);await prune();sortMine();mineOpen=null;renderMine();track('mine_dup')}));
      x.appendChild(btn('🗑️ '+t('mineDel'),'del',async()=>{if(!confirm(t('mineDelQ').replace('{n}',r.name)))return;if(minePlaying===r.id)stopMine();
        try{await dbDo('readwrite',st=>st.delete(r.id))}catch(e){}mine=mine.filter(z=>z.id!==r.id);mineOpen=null;renderMine();track('mine_deleted')},t('mineDel')+': '+r.name));
      li.appendChild(x)}
    ul.appendChild(li);
  });
}
